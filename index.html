<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Geometry Dash Webport</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #111827; color: #fff; font: 16px system-ui, sans-serif;

    a {
      display: inline-block; margin-top: 18px; padding: 14px 24px;
      border-radius: 10px; background: #22c55e; color: #07130a;
      font-weight: 700; text-decoration: none;
    }
    a:hover { background: #4ade80; }
  </style>
</head>

  <main>
    <h1>Geometry Dash Webport</h1>
    <p>Open the original webport on its official hosting page.</p>
