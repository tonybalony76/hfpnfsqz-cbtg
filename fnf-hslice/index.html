class OptionsState {
  enter() {
    this.sel = 0; this.rebinding = -1;
    this.rows = [
      { k: 'downscroll',  label: 'Downscroll',      type: 'bool' },
      { k: 'middlescroll',label: 'Middlescroll',    type: 'bool' },
      { k: 'ghostTap',    label: 'Ghost tapping',   type: 'bool' },
      { k: 'hideOpponent',label: 'Hide opponent notes', type: 'bool' },
      { k: 'offsetMs',    label: 'Audio offset',    type: 'num', step: 5, min: -300, max: 300, unit: ' ms' },
      { k: 'speedMode',   label: 'Scroll speed',    type: 'enum', vals: ['chart', 'constant'] },
      { k: 'constantSpeed', label: 'Constant speed value', type: 'num', step: 0.1, min: 0.5, max: 6, fixed: 1 },
      { k: '__binds',     label: 'Keybinds',        type: 'binds' },
    ];
    addEventListener('keydown', this._rb = e => {
      if (this.rebinding < 0) return;
      e.preventDefault();
      if (e.code === 'Escape') { this.rebinding = -1; return; }
      OPT.binds[this.rebinding] = [e.code];
      this.rebinding = this.rebinding < 3 ? this.rebinding + 1 : -1;
      saveOpts();
    }, true);
  }
  exit() { removeEventListener('keydown', this._rb, true); saveOpts(); }
  update() {
    if (this.rebinding >= 0) return;
    const r = this.rows[this.sel];
    if (Input.just('ArrowUp'))   this.sel = (this.sel + this.rows.length - 1) % this.rows.length;
    if (Input.just('ArrowDown')) this.sel = (this.sel + 1) % this.rows.length;
    const dx = (Input.just('ArrowRight') ? 1 : 0) - (Input.just('ArrowLeft') ? 1 : 0);
    if (r.type === 'bool' && (dx || Input.just('Enter'))) OPT[r.k] = !OPT[r.k];
    if (r.type === 'num' && dx) OPT[r.k] = clamp(round2(OPT[r.k] + dx * r.step), r.min, r.max);
    if (r.type === 'enum' && dx) {
      const i = r.vals.indexOf(OPT[r.k]);
      OPT[r.k] = r.vals[(i + dx + r.vals.length) % r.vals.length];
    }
    if (r.type === 'binds' && Input.just('Enter')) this.rebinding = 0;
    if (Input.just('Escape')) { saveOpts(); Game.set(new MenuState()); }
  }
  draw() {
    ctx.fillStyle = '#0d0818'; ctx.fillRect(0, 0, W, H);
    text('options', 60, 90, 40, '#ff5ea8', 'left', 'bold', 7);
    this.rows.forEach((r, i) => {
      const on = i === this.sel, y = 172 + i * 60;
      if (on) { ctx.fillStyle = 'rgba(255,94,168,.12)'; ctx.fillRect(40, y - 36, W - 80, 50); }
      text(r.label, 70, y, 28, on ? '#fff' : '#7d7092', 'left', 'bold', 3);
      let v;
      if (r.type === 'bool') v = OPT[r.k] ? 'on' : 'off';
      else if (r.type === 'binds') v = OPT.binds.map(b => keyName(b[0])).join('  ');
      else v = (r.fixed ? OPT[r.k].toFixed(r.fixed) : OPT[r.k]) + (r.unit || '');
      text(v, W - 70, y, 26, on ? '#ffd9ec' : '#5e5375', 'right', 'bold', 3);
    });
    if (this.rebinding >= 0) {
      ctx.fillStyle = 'rgba(8,4,14,.9)'; ctx.fillRect(0, 0, W, H);
      text('press a key for ' + ['left', 'down', 'up', 'right'][this.rebinding], W / 2, H / 2, 40, '#fff', 'center');
      text('esc keeps the current bind', W / 2, H / 2 + 50, 20, '#8e81a6', 'center', 'normal', 0);
    } else {
      text('left / right changes a value · esc saves and exits', 60, H - 44, 19, '#584d6d', 'left', 'normal', 0);
    }
  }
}
function keyName(c) { return c.replace(/^Key|^Digit/, '').replace(/^Arrow/, '').toLowerCase(); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function round2(v) { return Math.round(v * 100) / 100; }

/* Story mode: the weeks from engineassets/weeks.js, played in order. */
class WeeksState {
  enter() { this.sel = 0; this.diff = 0; this.t = 0; }
  weeks() { return HSLICE.weeks; }
  // the week lists folder names, so match those first
  songs(w) {
    return (w ? w.songs : []).map(n => CONFIG.songs.find(s => s.folder === n) || CONFIG.songs.find(s => s.id === n))
                             .filter(Boolean);
  }
  diffs() { const s = this.songs(this.weeks()[this.sel])[0]; return (s && s.diffs) || ['normal']; }
  update(dt) {
    this.t += dt;
    const ws = this.weeks(), n = ws.length;
    if (!n) return Game.set(new MenuState());
    if (Input.just('ArrowUp'))   { this.sel = (this.sel + n - 1) % n; this.diff = 0; }
    if (Input.just('ArrowDown')) { this.sel = (this.sel + 1) % n;     this.diff = 0; }
    const ds = this.diffs();
    if (Input.just('ArrowRight')) this.diff = (this.diff + 1) % ds.length;
    if (Input.just('ArrowLeft'))  this.diff = (this.diff + ds.length - 1) % ds.length;
    if (Input.just('Escape')) Game.set(new MenuState());
    if (Input.just('Enter') || Input.just('Space')) {
      const list = this.songs(ws[this.sel]);
      if (!list.length) return;
      Game.set(new PlayState(), list[0], ds[this.diff % ds.length], '',
               { week: ws[this.sel].id, list, index: 0, score: 0 });
    }
  }
  draw() {
    ctx.fillStyle = '#0d0818'; ctx.fillRect(0, 0, W, H);
    const ws = this.weeks(), w = ws[this.sel], list = this.songs(w), ds = this.diffs();
    text('story', 60, 90, 40, '#fff', 'left', 'bold', 7);
    const per = 7;                            // scrolls, so any number of weeks is reachable
    const top = Math.max(0, Math.min(this.sel - 3, ws.length - per));
    ws.slice(top, top + per).forEach((x, k) => {
      const i = top + k, on = i === this.sel, y = 190 + k * 62;
      text(x.name, 90 + (on ? Math.sin(this.t * 4) * 6 : 0), y, on ? 44 : 32,
           on ? '#fff' : '#6d6183', 'left', 'bold', on ? 6 : 3);
    });
    if (ws.length > per) text((this.sel + 1) + ' / ' + ws.length, 90, H - 80, 17, '#584d6d', 'left', 'normal', 0);
    const x0 = W * 0.52;
    text(w ? w.name : '—', x0, 190, 30, '#ff5ea8', 'left', 'bold', 5);
    if (!list.length) text('no songs here yet', x0, 236, 20, '#8e81a6', 'left', 'normal', 0);
    const rows = Math.min(list.length, 9);    // keep clear of the difficulty line
    for (let i = 0; i < rows; i++) text((i + 1) + '.  ' + list[i].name, x0, 240 + i * 34, 22, '#cbbfe0', 'left', 'normal', 0);
    let y = 244 + rows * 34;
    if (list.length > rows) { text('+ ' + (list.length - rows) + ' more', x0, y, 18, '#8e81a6', 'left', 'normal', 0); y += 26; }
    const miss = (w ? w.songs.length : 0) - list.length;
    if (miss > 0) text(miss + ' song' + (miss === 1 ? '' : 's') + ' not installed yet', x0, y, 17, '#ffc463', 'left', 'normal', 0);
    text('difficulty:  ' + (ds[this.diff % ds.length] || 'normal'), x0, H - 120, 24, '#fff', 'left', 'bold', 4);
    text('up/down week · left/right difficulty · enter plays the whole week · esc backs out',
         60, H - 44, 19, '#584d6d', 'left', 'normal', 0);
  }
}

class FreeplayState {
  enter(sel = 0, diff = 0) {
    this.sel = sel; this.diff = diff; this.vari = 0; this.t = 0;
    this.list = CONFIG.songs; this.scanning = true;
    discoverSongs().then(l => { this.list = l; this.scanning = false;
      this.sel = Math.min(this.sel, l.length - 1); });
  }
  cur()   { return this.list[this.sel] || { name: '—', diffs: ['normal'], variations: [] }; }
  diffs() {
    // a variation can have its own difficulties (erect has erect / nightmare)
    const c = this.cur(), v = this.varis()[this.vari || 0];
    return (v && v !== 'default' && c.variationDiffs && c.variationDiffs[v]) || c.diffs || ['normal'];
  }
  varis() { return ['default'].concat(this.cur().variations || []); }
  update(dt) {
    this.t += dt;
    const n = this.list.length;
    if (!n) { if (Input.just('Escape')) Game.set(new MenuState()); return; }
    if (Input.just('ArrowUp'))   { this.sel = (this.sel + n - 1) % n; this.diff = 0; this.vari = 0; }
    if (Input.just('ArrowDown')) { this.sel = (this.sel + 1) % n;     this.diff = 0; this.vari = 0; }
    const ds = this.diffs(), vs = this.varis();
    this.diff = Math.min(this.diff, ds.length - 1);
    this.vari = Math.min(this.vari, vs.length - 1);
    if (Input.just('ArrowLeft'))  this.diff = (this.diff + ds.length - 1) % ds.length;
    if (Input.just('ArrowRight')) this.diff = (this.diff + 1) % ds.length;
    if (Input.just('Tab'))        this.vari = (this.vari + 1) % vs.length;
    if (Input.just('Escape')) Game.set(new MenuState());
    if (Input.just('Enter') || Input.just('Space'))
      Game.set(new PlayState(), this.cur(), ds[this.diff],
               this.vari > 0 ? vs[this.vari] : '');
  }
  draw() {
    ctx.fillStyle = '#0d0818'; ctx.fillRect(0, 0, W, H);
    const cur = this.cur();
    ctx.fillStyle = cur.color || '#372a4a'; ctx.globalAlpha = 0.22;
    ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
    text('freeplay', 60, 90, 40, '#fff', 'left', 'bold', 7);

    if (!this.list.length) {
      text(this.scanning ? 'scanning…' : 'No songs found.', 90, 300, 40, '#fff', 'left', 'bold', 6);
      if (!this.scanning) {
        text('Drop a song folder or a .fnfc onto the window,', 90, 352, 24, '#9a8cb4', 'left', 'normal', 0);
        text('or serve this file over http next to an assets/ folder.', 90, 384, 24, '#9a8cb4', 'left', 'normal', 0);
      }
      text('esc to go back', 60, H - 44, 19, '#584d6d', 'left', 'normal', 0);
      return;
    }

    const top = Math.max(0, Math.min(this.sel - 2, this.list.length - 5));
    this.list.slice(top, top + 5).forEach((s, k) => {
      const i = top + k, on = i === this.sel, y = 210 + k * 78;
      const x = 90 + (on ? Math.sin(this.t * 4) * 6 : 0);
      text(s.name, x, y, on ? 50 : 38, on ? '#fff' : '#6d6183', 'left', 'bold', on ? 7 : 4);
      if (on && s.artist) text(s.artist, x + 4, y + 26, 18, '#9a8cb4', 'left', 'normal', 0);
    });

    const ds = this.diffs(), vs = this.varis();
    text('‹  ' + ds[this.diff] + '  ›', W - 90, 210, 38, '#fff', 'right', 'bold', 6);
    if (ds.length > 1) text(ds.join(' · '), W - 90, 244, 17, '#6d6183', 'right', 'normal', 0);
    if (vs.length > 1) text('tab: ' + vs[this.vari], W - 90, 292, 24, '#ffd9ec', 'right', 'bold', 4);
    if (cur.stage) text('stage: ' + cur.stage, W - 90, 330, 17, '#6d6183', 'right', 'normal', 0);
    if (this.list.length === 1 && this.list[0].builtin) {
      text('Only the built-in test chart is loaded.', 90, 520, 22, '#9a8cb4', 'left', 'normal', 0);
      text('Drop a song folder or .fnfc on this window — or, over http,', 90, 552, 22, '#9a8cb4', 'left', 'normal', 0);
      text('add assets/data/songList.json listing your folders: ["bro"]', 90, 584, 22, '#6d6183', 'left', 'normal', 0);
    }
    if (this.list.length > 5)
      text(`${this.sel + 1} / ${this.list.length}`, W - 90, H - 44, 17, '#584d6d', 'right', 'normal', 0);
    text('up/down song · left/right difficulty · tab variation · enter plays', 60, H - 44, 19, '#584d6d', 'left', 'normal', 0);
  }
}

/* ============================================================ PLAY STATE = */
class PlayState {
  async enter(songMeta, difficulty, variation, story) {
    this.story = story || null;
    this.meta = songMeta;
    this.difficulty = difficulty || (songMeta.diffs && songMeta.diffs[0]) || 'normal';
    this.variation = variation || '';
    this.stage = CONFIG.stage;
    this.loading = true;
    this.err = null;
    this.events = []; this.eventIdx = 0;
    this.bopRate = 4; this.bopIntensity = 1.015; this.bopOffset = 0;
    this.vocalsMuted = false;
    this.cam = new Camera();
    this.conductor = new Conductor();
    this.started = false; this.paused = false; this.pauseSel = 0;
    this.countdown = -1; this.countTimer = 0;
    this.score = 0; this.combo = 0; this.maxCombo = 0; this.misses = 0;
    this.hits = { sick: 0, good: 0, bad: 0, shit: 0 };
    this.accWeight = 0; this.accTotal = 0;
    this.health = CONFIG.health.start;
    this.popups = [];
    this.hudZoom = 1; this.camBop = 0;
    this.songLength = 0;

    try { await this.load(); } catch (e) { this.err = String(e.message || e); }
    this.loading = false;
  }

  async load() {
    await HSLICE.ready();   // sprites.js / mods.js may still be arriving
    const folder = this.meta.folder;
    const id = this.meta.id || folder;
    const diff = this.difficulty;
    const V = this.variation ? '-' + this.variation : '';

    // chart ----------------------------------------------------------------
    // V-Slice pairs are <name>-chart.json + <name>-metadata.json, under either
    // data/songs/ or songs/. Legacy charts are a single flat file.
    const chartNames = [
      `${folder}/${id}-chart${V}.json`,
      `${folder}/${id}-chart.json`,
      `${folder}/chart.json`,
      `${folder}/${id}-${diff}.json`,
      `${folder}/${id}.json`,
      `${folder}/${folder}.json`,
    ];
    // A mod carries its chart inline, so nothing is fetched — this is the path
    // that works with no server at all.
    const mod = this.meta.mod || HSLICE.songs.get(this.meta.id);
    // picking a variation ("erect") of a mod song uses that variation's own data
    const vkey = V.replace(/^-/, '');
    const src = (mod && vkey && mod.variationData && mod.variationData[vkey]) || mod;
    let raw = null;
    if (src && src.charts) raw = src.charts[diff] || src.charts[Object.keys(src.charts)[0]] || null;
    if (!raw) for (const c of chartNames) {
      const f = await Assets.findJson(CONFIG.roots.chart, c);
      if (f) { raw = f.data; break; }
    }
    let metaRaw = (src && src.metadata) || null;
    if (!metaRaw) for (const c of [`${folder}/${id}-metadata${V}.json`,
                     `${folder}/${id}-metadata.json`,
                     `${folder}/metadata.json`]) {
      const f = await Assets.findJson(CONFIG.roots.chart, c);
      if (f) { metaRaw = f.data; break; }
    }

    if (!raw && !metaRaw) {
      if (this.meta.folder === 'test') this.chart = ChartLoader.generateTest();
      else throw new Error(`no chart found for "${folder}" — expected ${id}-chart.json`);
    } else if (!raw) {
      throw new Error(`found ${id}-metadata.json but no ${id}-chart.json`);
    } else {
      this.chart = ChartLoader.parse(raw, metaRaw, diff);
    }
    this.difficulty = this.chart.difficulty || diff;
    this.events = this.chart.events || [];
    this.eventIdx = 0;

    this.conductor.setBPM(this.chart.bpm);
    this.conductor.setChanges(this.chart.changes || [{ time: 0, bpm: this.chart.bpm }]);
    this.conductor.onBeat = b => this.onBeat(b);

    this.speed = OPT.speedMode === 'constant' ? OPT.constantSpeed : this.chart.speed;

    // audio ----------------------------------------------------------------
    await Game.audio.loadSong(folder, this.chart, V.replace(/^-/, ''), this.meta.audioRoots);
    this.songLength = Game.audio.length || this.chart.length ||
      (this.chart.notes.length ? this.chart.notes[this.chart.notes.length - 1].time + 4000 : 60000);
    if (Game.audio.virtual) Game.audio.length = this.songLength;

    // stage ----------------------------------------------------------------
    // A mod's stage, a V-Slice stage json, or CONFIG.stage — and the playing
    // mod's own folder is searched first for the images.
    const stageName = this.meta.stageName || this.chart.stage;
    const st = await loadStage(stageName, this.meta.modDir ? [this.meta.modDir] : [], this.meta.modDir);
    this.stage = st;
    this.fixedCam = st.fixedCam ? Object.assign({}, st.fixedCam) : null;
    this.layers = st.layers;
    this.frontLayers = st.front || [];
    for (const l of [...this.layers, ...this.frontLayers])
      l.orig = { x: l.x, y: l.y, sx: l.sx, sy: l.sy };   // what R resets to

    // The simple case: a bg.png in the mod folder, and no stage defined.
    // remember which name matched, or a saved layout would point at "bg" when
    // the file is really background.png and it would vanish on reload
    let autoBg = null, autoBgName = 'bg';
    if (!this.layers.length && !this.frontLayers.length && this.meta.modDir) {
      autoBg = await findStageImage('bg', [this.meta.modDir]);
      if (!autoBg) { autoBg = await findStageImage('background', [this.meta.modDir]); autoBgName = 'background'; }
    }

    // characters -----------------------------------------------------------
    this.bf  = await Character.load(this.chart.player,   true,  this.meta.modDir);
    this.dad = await Character.load(this.chart.opponent, false, this.meta.modDir);
    this.gf  = await Character.load(this.chart.gf,       false, this.meta.modDir);
    // A mod's layout is its stage.js file — one source of truth. Only songs with
    // no mod folder keep a layout in the browser instead.
    const saved = this.meta.modDir ? {} : (loadArrangement(st.name) || {});
    const sp = { bf: saved.bf || st.bf, dad: saved.dad || st.dad, gf: saved.gf || st.gf };
    const sizes = Object.assign({}, st.scales || {}, saved.scales || {});
    if (saved.camera) this.fixedCam = Object.assign({}, saved.camera);
    for (const [k, c, p] of [['bf', this.bf, sp.bf], ['dad', this.dad, sp.dad], ['gf', this.gf, sp.gf]]) {
      c.baseScale = c.sprite ? c.sprite.scale : 1;          // the character's own size, for R
      if (c.sprite && typeof sizes[k] === 'number') c.sprite.scale = sizes[k];
      c.defFlip = c.sprite ? c.sprite.flipX : false;        // how they normally face
      c.setFlip(!!(saved.flips ? saved.flips[k] : (st.flips && st.flips[k])));
      c.x = p[0] + (c.posOffset ? c.posOffset[0] : 0);
      c.y = p[1] + (c.posOffset ? c.posOffset[1] : 0);
    }
    // bg.png lives in the world with the characters, so it moves with them and
    // they stay standing on it. Placed from the stage spots, not saved tweaks,
    // so nudging a character never makes the background jump.
    if (autoBg) {
      const l = makeLayer(autoBg, Object.assign({ src: autoBgName, name: autoBgName }, this.fitBackground(autoBg)), 0);
      l.orig = { x: l.x, y: l.y, sx: l.sx, sy: l.sy };
      this.layers.push(l);
    }
    if (saved.layers) for (const l of [...this.layers, ...this.frontLayers]) {
      const v = saved.layers[l.key];
      if (!v) continue;
      for (const k of ['x', 'y', 'sx', 'sy']) if (typeof v[k] === 'number') l[k] = v[k];
    }
    // stage camera offsets win over the character's own when present
    for (const [k, c] of [['bf', this.bf], ['dad', this.dad], ['gf', this.gf]])
      if (st.charOffsets && st.charOffsets[k]) c.camOffset = st.charOffsets[k];

    // ui atlases -----------------------------------------------------------
    this.noteAtlas = await Assets.atlas(CONFIG.noteskin.sheet);
    // quiet: loose sick.png / num0.png (below) are the usual case, not an error
    this.ratingAtlas = await Assets.atlas(CONFIG.ui.ratings, { quiet: true });
    this.numAtlas = await Assets.atlas(CONFIG.ui.numbers, { quiet: true });
    // Base game and Psych ship ratings as loose PNGs (sick.png, num0.png...),
    // not a sheet — so without an atlas, look for those.
    this.ratingImgs = {}; this.numImgs = [];
    if (!this.ratingAtlas)
      for (const r of ['sick', 'good', 'bad', 'shit'])
        this.ratingImgs[r] = await Assets.findImage(CONFIG.roots.images, 'ui/' + r + '.png');
    if (!this.numAtlas)
      for (let d = 0; d < 10; d++)
        this.numImgs[d] = await Assets.findImage(CONFIG.roots.images, 'ui/num' + d + '.png');
    // healthIcon can differ from the character id (e.g. "dad" -> icon "face")
    // icon-<id>.png beside mod.js first, then the usual ui/icons/ folders
    const icon = async id => (this.meta.modDir && await Assets.image(this.meta.modDir + 'icon-' + id + '.png'))
      || await Assets.findImage(CONFIG.roots.images, CONFIG.ui.icons + id + '.png');
    this.iconBF = await icon(this.bf.healthIcon || this.chart.player);
    this.iconOP = await icon(this.dad.healthIcon || this.chart.opponent);

    // strums ---------------------------------------------------------------
    this.strums = [[], []];
    for (let p = 0; p < 2; p++)
      for (let d = 0; d < 4; d++) this.strums[p].push(new Strum(d, p === 1, this.noteAtlas));
    this.layoutStrums();

    // notes ----------------------------------------------------------------
    this.notes = this.chart.notes.map(n => Object.assign({}, n));
    this.cam.baseZoom = st.zoom;
    this.cam.follow(st.camera[0], st.camera[1]);
    this.cam.snap();
    // events at t<=0 (opening focus/zoom) apply before the countdown
    this.runEvents(0);
    this.countdown = 4; this.countTimer = 0;
  }

  layoutStrums() {
    const y = OPT.downscroll ? H - NOTE_SIZE - 42 : 46;
    const laneW = LANE_GAP * 4;
    let opX = 68, plX = W - laneW - 68;
    if (OPT.middlescroll) { plX = (W - laneW) / 2; opX = -9999; }
    for (let d = 0; d < 4; d++) {
      this.strums[0][d].x = opX + d * LANE_GAP; this.strums[0][d].y = y;
      this.strums[1][d].x = plX + d * LANE_GAP; this.strums[1][d].y = y;
    }
    this.strumY = y;
  }

  /* --------------------------------------------------------- note maths -- */
  noteY(time) {
    const diff = time - this.conductor.songPosition;
    const d = 0.45 * diff * this.speed;
    return this.strumY + (OPT.downscroll ? -d : d);
  }

  onBeat(b) {
    if (b < 0) return;
    this.bf.dance(); this.dad.dance(); this.gf.dance();
    // SetCameraBop rate is "beats between bops"; intensity is a zoom multiplier
    const rate = Math.max(1, this.bopRate | 0);
    if ((b - (this.bopOffset | 0)) % rate === 0) {
      const amt = (this.bopIntensity || 1.015) - 1;
      this.cam.bop += amt;
      this.hudZoom = 1 + amt * 2;
    }
  }

  /* ------------------------------------------------------------ events -- */
  steps(n) { return (n || 0) * this.conductor.stepCrochet; }

  runEvents(pos) {
    while (this.eventIdx < this.events.length && this.events[this.eventIdx].time <= pos) {
      this.fireEvent(this.events[this.eventIdx++]);
    }
  }

  charFor(i) { return [this.bf, this.dad, this.gf][i | 0] || this.bf; }

  /* One shot with all three characters in it, for charts that never move the
     camera. Sized from each character's idle frame so it doesn't twitch with
     every pose, with room top and bottom for the arrows and health bar. */
  wideShot() {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const c of [this.bf, this.dad, this.gf]) {
      if (!c) continue;
      const a = c.sprite && (c.sprite.anims.idle || c.sprite.anims.danceLeft || c.sprite.cur);
      const f = a && a.frames && a.frames[0];
      const w = f ? f.fw * c.sprite.scale : 190, h = f ? f.fh * c.sprite.scale : 300;
      x0 = Math.min(x0, c.x); y0 = Math.min(y0, c.y);
      x1 = Math.max(x1, c.x + w); y1 = Math.max(y1, c.y + h);
    }
    const zoom = Math.min(W / (x1 - x0 + 200), H / (y1 - y0 + 260), this.stage.zoom || 1);
    return { x: (x0 + x1) / 2, y: (y0 + y1) / 2, zoom };
  }

  fireEvent(e) {
    const v = e.v || {};
    switch (e.type) {
      case 'FocusCamera': {
        if (this.fixedCam) break;             // the stage's fixed shot wins
        // char: 0 player, 1 opponent, 2 gf, -1 a fixed spot at (x, y).
        // V-Slice also allows the value to be just the number: "v": 1
        const char = (typeof e.v === 'number' || typeof e.v === 'string') ? +e.v : (v.char ?? 0);
        let x, y;
        if (+char === -1) { x = v.x || 0; y = v.y || 0; }
        else {
          const c = this.charFor(char);
          const m = c.mid();
          x = m[0] + c.camOffset[0] + (v.x || 0);
          y = m[1] + c.camOffset[1] + (v.y || 0);
        }
        const ease = v.ease;
        if (ease === 'INSTANT') this.cam.tweenTo(x, y, 0);
        else if (!ease || ease === 'CLASSIC') { this.cam.posTween = null; this.cam.follow(x, y); }
        else this.cam.tweenTo(x, y, this.steps(v.duration), easeFn(ease, v.easeDir));
        break;
      }
      case 'ZoomCamera': {
        // "direct" = literal camera zoom, "stage" = multiple of the stage default
        if (this.wide || this.fixedCam) break;   // a held shot owns the zoom
        const mul = v.mode === 'stage' ? this.stage.zoom : 1;
        const z = typeof e.v === 'number' ? e.v : (v.zoom ?? 1);   // "v": 1.2 shorthand
        const target = z * mul * (this.stage.zoomScale || 1);
        if (!v.ease || v.ease === 'INSTANT') this.cam.tweenZoom(target, 0);
        else this.cam.tweenZoom(target, this.steps(v.duration), easeFn(v.ease, v.easeDir));
        break;
      }
      case 'SetCameraBop': {
        this.bopRate = v.rate || 4;
        this.bopIntensity = v.intensity || 1.015;
        this.bopOffset = v.offset || 0;
        break;
      }
      case 'PlayAnimation': {
        const c = this.charFor(v.target === 'gf' ? 2 : v.target === 'dad' || v.target === 'opponent' ? 1 : 0);
        if (c.sprite && v.anim) { c.sprite.play(v.anim, v.force !== false); c.holdTimer = -0.6; }
        break;
      }
      default: break;   // unknown events are ignored, not fatal
    }
  }

  /* ------------------------------------------------------------- input --- */
  laneDown(lane) {
    if (this.loading || this.err || this.arrange) return;
    if (this.paused) { this.pauseInput(lane); return; }
    if (!this.started) return;
    const pos = this.conductor.songPosition;
    let best = null, bestAbs = 1e9;
    for (const n of this.notes) {
      if (n.player !== 1 || n.hit || n.missed || n.dir !== lane) continue;
      const d = n.time - pos;
      if (d > CONFIG.judge.shit) break;
      const a = Math.abs(d);
      if (a <= CONFIG.judge.shit && a < bestAbs) { best = n; bestAbs = a; }
    }
    if (best) { this.hitNote(best, bestAbs); this.strums[1][lane].play('confirm'); }
    else {
      this.strums[1][lane].play('press');
      if (!OPT.ghostTap) this.miss(lane, null);
    }
  }
  laneUp(lane) {
    if (this.loading || this.paused || this.arrange) return;
    const s = this.strums[1][lane];
    if (s) s.play('static');
  }

  hitNote(n, absDiff) {
    n.hit = true;
    const J = CONFIG.judge;
    const r = absDiff <= J.sick ? 'sick' : absDiff <= J.good ? 'good' : absDiff <= J.bad ? 'bad' : 'shit';
    this.hits[r]++;
    this.score += CONFIG.points[r];
    this.accWeight += CONFIG.weight[r]; this.accTotal++;
    this.combo++; this.maxCombo = Math.max(this.maxCombo, this.combo);
    this.health = Math.min(CONFIG.health.max, this.health + CONFIG.health.hit);
    this.bf.sing(n.dir);
    if (this.vocalsMuted) { Game.audio.setVocalGain('player', 1); this.vocalsMuted = false; }
    this.popRating(r, this.combo);
    if (n.len > 0) n.held = true;
  }

  miss(dir, n) {
    if (n) { n.missed = true; n.hit = false; }
    this.combo = 0; this.misses++;
    this.score -= 10;
    this.accTotal++;
    this.health -= CONFIG.health.miss;
    this.bf.sing(dir, true);
    Game.audio.setVocalGain('player', 0); this.vocalsMuted = true;
    if (this.health <= 0) this.die();
  }

  die() {
    Game.audio.stop();
    Game.set(new GameOverState(), this.meta, this.difficulty, this.story);
  }

  popRating(r, combo) {
    this.popups.push({ kind: 'rating', r, t: 0, x: W * 0.62 + rnd(-8, 8), y: H * 0.36 + rnd(-8, 8) });
    if (combo >= 10) this.popups.push({ kind: 'combo', n: combo, t: 0, x: W * 0.62, y: H * 0.36 + 110 });
  }

  /* ------------------------------------------------------------ update --- */
  update(dt) {
    if (this.loading || this.err) {
      if (this.err && (Input.just('Escape') || Input.just('Enter'))) Game.set(new FreeplayState());
      return;
    }
    if (Input.just('KeyE') && !this.paused) this.toggleArrange();
    if (this.arrange) { this.arrangeUpdate(); return; }
    if (Input.just('Enter') && this.started && !this.paused) { this.togglePause(); return; }
    if (this.paused) { this.pauseUpdate(); return; }

    if (this.countdown > 0) {
      this.countTimer += dt;
      const beat = this.conductor.crochet / 1000;
      if (this.countTimer >= beat) {
        this.countTimer -= beat; this.countdown--;
        this.bf.dance(true); this.dad.dance(true); this.gf.dance(true);
        this.cam.tzoom = this.stage.zoom + 0.02;
        if (this.countdown === 0) { Game.audio.play(0); this.started = true; }
      }
    }

    if (this.started) {
      this.conductor.tick(Game.audio.position - OPT.offsetMs);
      if (Game.audio.ended || this.conductor.songPosition > this.songLength + 500) return this.finish();
    }

    const pos = this.conductor.songPosition;

    // opponent auto play + player miss window
    for (const n of this.notes) {
      if (n.hit || n.missed) continue;
      if (n.time - pos > 2000) break;
      if (n.player === 0) {
        if (n.time <= pos) {
          n.hit = true; n.held = n.len > 0;
          this.dad.sing(n.dir);
          this.strums[0][n.dir].play('confirm');
        }
      } else if (pos - n.time > CONFIG.judge.shit) {
        this.miss(n.dir, n);
      }
    }

    // sustains
    for (const n of this.notes) {
      if (!n.held || n.dropped || n.len <= 0) continue;
      if (pos > n.holdEnd) { n.held = false; continue; }
      if (n.player === 1) {
        if (Input.lanes[n.dir]) {
          const d = Math.min(pos, n.holdEnd) - n.lastHoldScore;
          if (d > 0) {
            n.lastHoldScore += d;
            this.health = Math.min(CONFIG.health.max, this.health + CONFIG.health.holdPerSec * (d / 1000));
            this.score += Math.round(d * 0.06);
          }
          this.bf.sing(n.dir);
          this.strums[1][n.dir].play('confirm');
        } else if (pos > n.time + 100) {
          n.dropped = true; n.held = false;
          this.combo = 0; this.health -= CONFIG.health.miss * 0.5;
          if (this.health <= 0) this.die();
        }
      } else {
        this.dad.sing(n.dir);
        this.strums[0][n.dir].play('confirm');
      }
    }

    // camera: V-Slice drives it from events, legacy from mustHitSection
    // No camera moves anywhere in the chart? Hold one shot with everyone in it.
    if (this.wide === undefined)
      this.wide = !this.events.some(e => e.type === 'FocusCamera') &&
                  !(this.chart.sections && this.chart.sections.length);
    if (this.events.length) {
      this.runEvents(pos);
    } else if (this.chart.sections) {
      const sec = this.chart.sections.find(s => pos >= s.start && pos < s.end);
      const focus = sec && sec.mustHit ? this.bf : this.dad;
      const m = focus.mid();
      this.cam.follow(m[0] + focus.camOffset[0], m[1] + focus.camOffset[1]);
    }
    if (this.fixedCam && !this.arrange) {
      const fc = this.fixedCam;
      if (!this.fixedSet) {                    // start there, don't swoop in
        this.cam.x = this.cam.tx = fc.x; this.cam.y = this.cam.ty = fc.y;
        this.cam.zoom = fc.zoom; this.fixedSet = true;
      }
      this.cam.follow(fc.x, fc.y);
      if (!this.cam.zoomTween) this.cam.baseZoom = fc.zoom;
    } else if (this.wide && !this.arrange) {
      const w = this.wideShot();
      if (!this.wideSet) {                    // start there, don't swoop in
        this.cam.x = this.cam.tx = w.x; this.cam.y = this.cam.ty = w.y;
        this.cam.zoom = w.zoom; this.wideSet = true;
      }
      this.cam.follow(w.x, w.y);
      if (!this.cam.zoomTween) this.cam.baseZoom = w.zoom;
    }
    this.cam.update(dt);
    this.hudZoom += (1 - this.hudZoom) * Math.min(1, dt * 9);

    this.bf.update(dt, this.conductor.stepCrochet);
    this.dad.update(dt, this.conductor.stepCrochet);
    this.gf.update(dt, this.conductor.stepCrochet);
    for (const p of this.strums[0]) p.update(dt);
    for (const p of this.strums[1]) p.update(dt);

    for (const p of this.popups) p.t += dt;
    this.popups = this.popups.filter(p => p.t < 0.75);
  }

  finish() {
    Game.audio.stop();
    const st = this.story;
    if (st) {
      st.score = (st.score || 0) + this.score;
      const next = st.list[st.index + 1];
      if (next) {                              // straight into the next song of the week
        Game.set(new PlayState(), next, this.difficulty, '',
                 { week: st.week, list: st.list, index: st.index + 1, score: st.score });
        return;
      }
    }
    Game.set(new ResultsState(), this.meta, {
      score: st ? st.score : this.score, misses: this.misses, maxCombo: this.maxCombo,
      hits: this.hits, acc: this.accuracy, story: st,
    });
  }
  get accuracy() { return this.accTotal ? (this.accWeight / this.accTotal) * 100 : 0; }

  togglePause() {
    this.paused = !this.paused; this.pauseSel = 0;
    if (this.paused) Game.audio.pause(); else Game.audio.resume();
  }
  pauseInput(lane) {}
  pauseUpdate() {
    const items = ['resume', 'restart', 'quit to freeplay'];
    if (Input.just('ArrowUp'))   this.pauseSel = (this.pauseSel + 2) % 3;
    if (Input.just('ArrowDown')) this.pauseSel = (this.pauseSel + 1) % 3;
    if (Input.just('Escape')) this.togglePause();
    if (Input.just('Enter')) {
      const it = items[this.pauseSel];
      if (it === 'resume') this.togglePause();
      else if (it === 'restart') { Game.audio.stop(); Game.set(new PlayState(), this.meta, this.difficulty, this.variation, this.story); }
      else { Game.audio.stop(); Game.set(this.story ? new WeeksState() : new FreeplayState()); }
    }
  }

  /* -------------------------------------------------------------- draw --- */
  draw() {
    ctx.fillStyle = '#100a1c'; ctx.fillRect(0, 0, W, H);
    if (this.loading) { text('loading…', W / 2, H / 2, 34, '#cbbfe0', 'center'); return; }
    if (this.err) {
      text('could not start the song', W / 2, H / 2 - 30, 34, '#ff7d7d', 'center');
      text(this.err, W / 2, H / 2 + 16, 20, '#b9aac9', 'center', 'normal', 0);
      text('enter to go back', W / 2, H / 2 + 70, 20, '#7a6d90', 'center', 'normal', 0);
      return;
    }

    // ---- world
    ctx.save();
    this.cam.apply(ctx);
    for (const l of this.layers) this.drawLayer(l);
    if (!this.layers.length) {
      const g = ctx.createLinearGradient(0, 0, 0, H * 1.3);
      g.addColorStop(0, '#2a1a3f'); g.addColorStop(1, '#120c1e');
      ctx.fillStyle = g; ctx.fillRect(-500, -300, W + 1000, H + 900);
      ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.lineWidth = 2;
      for (let x = -400; x < W + 400; x += 80) { ctx.beginPath(); ctx.moveTo(x, -200); ctx.lineTo(x, H + 400); ctx.stroke(); }
    }
    this.gf.draw(ctx); this.dad.draw(ctx); this.bf.draw(ctx);
    // props with a zIndex above the characters' draw in front of them
    for (const l of (this.frontLayers || [])) this.drawLayer(l);
    ctx.restore();

    // ---- hud (hidden while arranging, so the stage is what you see)
    if (!this.arrange) {
      ctx.save();
      ctx.translate(W / 2, H / 2); ctx.scale(this.hudZoom, this.hudZoom); ctx.translate(-W / 2, -H / 2);
      this.drawStrums();
      this.drawNotes();
      this.drawHealthBar();
      this.drawScoreLine();
      this.drawPopups();
      ctx.restore();
    }

    if (this.countdown > 0) {
      const labels = { 4: '', 3: 'ready', 2: 'set', 1: 'go' };
      const l = labels[this.countdown];
      if (l) {
        const k = 1 - (this.countTimer / (this.conductor.crochet / 1000));
        ctx.globalAlpha = Math.max(0, k);
        text(l, W / 2, H / 2, 86 + (1 - k) * 16, '#fff', 'center', 'bold', 10);
        ctx.globalAlpha = 1;
      }
    }
    if (this.paused) this.drawPause();
    if (this.arrange) this.drawArrange();
  }

  drawStrums() {
    if (!OPT.middlescroll && !OPT.hideOpponent) for (const s of this.strums[0]) s.draw();
    for (const s of this.strums[1]) s.draw();
  }

  drawNotes() {
    const pos = this.conductor.songPosition;
    const ns = CONFIG.noteskin;
    for (const n of this.notes) {
      if (n.hit && n.len <= 0) continue;
      if (n.missed && !n.len) continue;
      if (n.player === 0 && (OPT.middlescroll || OPT.hideOpponent)) continue;
      const dt = n.time - pos;
      if (dt > 3000 / Math.max(0.5, this.speed) || dt < -1200) continue;
      const strum = this.strums[n.player][n.dir];
      const x = strum.x;
      const y = this.noteY(n.time);

      // sustain
      if (n.len > 0 && !n.dropped) {
        const tailY = this.noteY(n.holdEnd);
        this.drawSustain(x, y, tailY, n);
      }
      if (n.hit || n.missed) continue;

      ctx.save();
      if (n.missed) ctx.globalAlpha = 0.35;
      if (!this.drawNoteSprite(ns, n.dir, x, y)) drawArrowPlaceholder(x, y, NOTE_SIZE, n.dir, 'note');
      ctx.restore();
    }
  }

  drawNoteSprite(ns, dir, x, y) {
    if (!this.noteAtlas) return false;
    const frames = this.noteAtlas.byPrefix(ns.dirs[dir].note);
    if (!frames.length) return false;
    const f = frames[0], s = ns.scale;
    const dx = x + NOTE_SIZE / 2 - (f.fw * s) / 2 - f.fx * s;
    const dy = y + NOTE_SIZE / 2 - (f.fh * s) / 2 - f.fy * s;
    ctx.drawImage(this.noteAtlas.img, f.x, f.y, f.w, f.h, dx, dy, f.w * s, f.h * s);
    return true;
  }

  drawSustain(x, headY, tailY, n) {
    const cx = x + NOTE_SIZE / 2;
    const down = OPT.downscroll;
    let a = headY + NOTE_SIZE / 2, b = tailY + NOTE_SIZE / 2;
    let top = Math.min(a, b), bot = Math.max(a, b);
    // clip anything that has already crossed the strumline while holding
    const line = this.strumY + NOTE_SIZE / 2;
    if (n.held || n.hit) {
      if (down) bot = Math.min(bot, line);
      else      top = Math.max(top, line);
    }
    if (bot <= top) return;

    const ns = CONFIG.noteskin;
    const atlas = this.noteAtlas;
    const bodyFrames = atlas ? atlas.byPrefix(ns.dirs[n.dir].hold) : [];
    let tailFrames = atlas ? atlas.byPrefix(ns.dirs[n.dir].tail) : [];
    // the base game's NOTE_assets names the purple tail "pruple end hold" — a
    // typo Psych kept, so real sheets have it
    if (atlas && !tailFrames.length && n.dir === 0) tailFrames = atlas.byPrefix('pruple end hold');

    ctx.save();
    ctx.globalAlpha = (n.dropped ? 0.25 : (n.missed ? 0.3 : 0.85));
    if (bodyFrames.length && tailFrames.length) {
      const bf = bodyFrames[0], tf = tailFrames[0], s = ns.scale;
      const bw = bf.w * s, th = tf.h * s;
      const bodyBot = bot - th;
      if (bodyBot > top) {
        // tile-stretch the body
        ctx.drawImage(atlas.img, bf.x, bf.y, bf.w, bf.h, cx - bw / 2, top, bw, bodyBot - top);
      }
      ctx.save();
      if (down) { ctx.translate(0, bot); ctx.scale(1, -1); ctx.drawImage(atlas.img, tf.x, tf.y, tf.w, tf.h, cx - tf.w * s / 2, 0, tf.w * s, th); }
      else ctx.drawImage(atlas.img, tf.x, tf.y, tf.w, tf.h, cx - tf.w * s / 2, Math.max(top, bodyBot), tf.w * s, th);
      ctx.restore();
    } else {
      ctx.fillStyle = ns.colors[n.dir];
      const w = 34;
      roundRect(ctx, cx - w / 2, top, w, bot - top, w / 2); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 4; ctx.stroke();
    }
    ctx.restore();
  }

  drawHealthBar() {
    const bw = 600, bh = 22, bx = (W - bw) / 2;
    const by = OPT.downscroll ? 90 : H - 118;
    const ratio = clamp(this.health / CONFIG.health.max, 0, 1);
    ctx.save();
    ctx.fillStyle = '#000'; roundRect(ctx, bx - 5, by - 5, bw + 10, bh + 10, 8); ctx.fill();
    ctx.fillStyle = this.dad.healthColor; roundRect(ctx, bx, by, bw, bh, 5); ctx.fill();
    ctx.fillStyle = this.bf.healthColor;
    const pw = bw * ratio;
    ctx.save(); ctx.beginPath(); ctx.rect(bx + bw - pw, by, pw, bh); ctx.clip();
    roundRect(ctx, bx, by, bw, bh, 5); ctx.fill(); ctx.restore();

    // icons
    const ix = bx + bw - pw;
    const iconY = by + bh / 2 - 75;
    const losing = ratio < 0.2, winning = ratio > 0.8;
    this.drawIcon(this.iconOP, ix - 160, iconY, winning, false);
    this.drawIcon(this.iconBF, ix + 10, iconY, losing, true);
    ctx.restore();
  }
  drawIcon(img, x, y, alt, flip) {
    if (!img) return;
    // a two-frame sheet (normal | losing) is about twice as wide as tall;
    // a single square icon, common in V-Slice mods, draws whole
    const two = img.width >= img.height * 1.5;
    const fw = two ? img.width / 2 : img.width, fh = img.height;
    const sx = (two && alt) ? fw : 0;
    ctx.save();
    if (flip) { ctx.translate(x * 2 + 150, 0); ctx.scale(-1, 1); }
    ctx.drawImage(img, sx, 0, fw, fh, x, y, 150, 150);
    ctx.restore();
  }

  drawScoreLine() {
    const y = OPT.downscroll ? 148 : H - 60;
    const acc = this.accuracy.toFixed(2);
    const line = `score ${this.score}  ·  misses ${this.misses}  ·  ${acc}%  ·  ${rank(this.accuracy)}`;
    text(line, W / 2, y, 26, '#fff', 'center', 'bold', 5);
  }

  drawPopups() {
    for (const p of this.popups) {
      const k = p.t / 0.75;
      const lift = -50 * (1 - Math.pow(1 - k, 2));
      ctx.save();
      ctx.globalAlpha = k > 0.6 ? 1 - (k - 0.6) / 0.4 : 1;
      if (p.kind === 'rating') {
        if (!this.drawAtlasAt(this.ratingAtlas, p.r, p.x, p.y + lift, 0.7) &&
            !this.drawLoose(this.ratingImgs && this.ratingImgs[p.r], p.x, p.y + lift, 0.7))
          text(p.r, p.x, p.y + lift, 46, ratingColor(p.r), 'center', 'bold', 6);
      } else {
        if (!this.drawNumber(p.n, p.x, p.y + lift))
          text(String(p.n), p.x, p.y + lift, 40, '#fff', 'center', 'bold', 6);
      }
      ctx.restore();
    }
  }
  drawAtlasAt(atlas, prefix, cx, cy, s = 1) {
    if (!atlas) return false;
    const fr = atlas.byPrefix(prefix);
    if (!fr.length) return false;
    const f = fr[0];
    ctx.drawImage(atlas.img, f.x, f.y, f.w, f.h, cx - f.w * s / 2, cy - f.h * s / 2, f.w * s, f.h * s);
    return true;
  }
  drawLoose(img, cx, cy, s) {
    if (!img) return false;
    ctx.drawImage(img, cx - img.width * s / 2, cy - img.height * s / 2, img.width * s, img.height * s);
    return true;
  }
  drawNumber(n, cx, cy) {
    const loose = this.numImgs && this.numImgs.some(Boolean);
    if (!this.numAtlas && !loose) return false;
    const digits = String(n).split('');
    const s = 0.5, gap = 40;
    let ok = true;
    digits.forEach((d, i) => {
      const x = cx - (digits.length - 1) * gap / 2 + i * gap;
      ok = (this.numAtlas ? this.drawAtlasAt(this.numAtlas, 'num' + d, x, cy, s)
                          : this.drawLoose(this.numImgs[+d], x, cy, s)) && ok;
    });
    return ok;
  }

  /* Size a bare bg.png to cover everywhere the camera goes: across all three
     characters, out to the widest zoom the chart ever uses, plus the biggest
     focus nudge. Centred on them, which puts an ordinary background's floor
     near their feet. Press E to fine-tune; that saves for this stage. */
  fitBackground(img) {
    const st = this.stage;
    let cx0 = 1e9, cy0 = 1e9, cx1 = -1e9, cy1 = -1e9;
    for (const [c, p] of [[this.bf, st.bf], [this.dad, st.dad], [this.gf, st.gf]]) {
      const w = (c.sprite && c.sprite.width()) || 190, h = (c.sprite && c.sprite.height()) || 300;
      const mx = p[0] + w / 2 + ((c.camOffset && c.camOffset[0]) || 0);
      const my = p[1] + h / 2 + ((c.camOffset && c.camOffset[1]) || 0);
      cx0 = Math.min(cx0, mx); cx1 = Math.max(cx1, mx);
      cy0 = Math.min(cy0, my); cy1 = Math.max(cy1, my);
    }
    let zMin = st.zoom || 1, ox = 0, oy = 0;
    for (const e of (this.events || [])) {
      const v = e.v || {};
      if (e.type === 'ZoomCamera') {           // same maths as the event handler
        const z = (v.zoom ?? 1) * (v.mode === 'stage' ? (st.zoom || 1) : 1) * (st.zoomScale || 1);
        if (z > 0.2) zMin = Math.min(zMin, z);
      } else if (e.type === 'FocusCamera') {
        ox = Math.max(ox, Math.abs(v.x || 0)); oy = Math.max(oy, Math.abs(v.y || 0));
      }
    }
    const hw = W / 2 / zMin + ox, hh = H / 2 / zMin + oy;
    const x0 = cx0 - hw, x1 = cx1 + hw, y0 = cy0 - hh, y1 = cy1 + hh;
    const k = Math.max((x1 - x0) / img.width, (y1 - y0) / img.height) * 1.04;
    return { x: Math.round((x0 + x1) / 2 - img.width * k / 2),
             y: Math.round((y0 + y1) / 2 - img.height * k / 2),
             scale: +k.toFixed(3) };
  }

  /* Where a layer actually lands. Parallax follows Flixel's convention (the
     camera's top-left scrolls, not its centre), so V-Slice prop positions
     paste in unchanged: scroll 1 moves with the world, 0 is pinned to screen. */
  layerRect(l) {
    const sx = l.sx ?? l.scale ?? 1, sy = l.sy ?? l.scale ?? 1;
    const px = (this.cam.x - W / 2) * (1 - (l.scrollX ?? 1));
    const py = (this.cam.y - H / 2) * (1 - (l.scrollY ?? 1));
    return [l.x + px, l.y + py, l.img.width * sx, l.img.height * sy];
  }
  drawLayer(l) {
    const [x, y, w, h] = this.layerRect(l);
    ctx.save();
    if ((l.alpha ?? 1) !== 1) ctx.globalAlpha *= l.alpha;
    if (l.flipX || l.flipY) {
      ctx.translate(x + (l.flipX ? w : 0), y + (l.flipY ? h : 0));
      ctx.scale(l.flipX ? -1 : 1, l.flipY ? -1 : 1);
      ctx.drawImage(l.img, 0, 0, w, h);
    } else ctx.drawImage(l.img, x, y, w, h);
    ctx.restore();
  }

  /* ------------------------------------------------- arrange mode (key E) --
     Drag and resize the characters and the background. S saves the layout as
     stage.js — put that in the mod's folder and it loads automatically. */
  toggleArrange() {
    if (this.arrange) {
      this.arrange = null;
      this.cam.lockPos = this.cam.lockZoom = false;
      if (this.started) Game.audio.resume();
      return;
    }
    Game.audio.pause();
    const items = this.arrangeItems();
    this.arrange = { sel: Math.max(0, items.findIndex(it => it.ref === this.bf)), grab: null, msg: '', msgT: 0 };
    this.arrangeFit(false);
  }

  // everything the editor can move, in draw order (back to front)
  arrangeItems() {
    const out = [];
    for (const l of this.layers) out.push({ kind: 'layer', ref: l, label: layerLabel(l) });
    out.push({ kind: 'char', ref: this.gf,  label: 'gf' });
    out.push({ kind: 'char', ref: this.dad, label: 'dad' });
    out.push({ kind: 'char', ref: this.bf,  label: 'bf' });
    for (const l of (this.frontLayers || [])) out.push({ kind: 'layer', ref: l, label: layerLabel(l) + ' (front)' });
    return out;
  }
  itemRect(it) {
    if (it.kind === 'layer') return this.layerRect(it.ref);
    const c = it.ref;
    return [c.x, c.y, (c.sprite && c.sprite.width()) || 190, (c.sprite && c.sprite.height()) || 300];
  }

  arrangeFit(all) {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const it of this.arrangeItems()) {
      if (it.kind === 'layer' && !all) continue;
      const [x, y, w, h] = this.itemRect(it);
      x0 = Math.min(x0, x); y0 = Math.min(y0, y);
      x1 = Math.max(x1, x + w); y1 = Math.max(y1, y + h);
    }
    if (all && this.fixedCam) {
      const fc = this.fixedCam, fw = W / fc.zoom, fh = H / fc.zoom;
      x0 = Math.min(x0, fc.x - fw / 2); y0 = Math.min(y0, fc.y - fh / 2);
      x1 = Math.max(x1, fc.x + fw / 2); y1 = Math.max(y1, fc.y + fh / 2);
    }
    const pad = 160;
    this.cam.x = this.cam.tx = (x0 + x1) / 2;
    this.cam.y = this.cam.ty = (y0 + y1) / 2;
    this.cam.zoom = this.cam.tzoom = Math.min(W / (x1 - x0 + pad), H / (y1 - y0 + pad), 1);
    this.cam.bop = 1;
    this.cam.lockPos = this.cam.lockZoom = true;
  }

  screenToWorld(sx, sy) {
    const z = this.cam.zoom * (this.cam.bop || 1);
    return [(sx - W / 2) / z + this.cam.x, (sy - H / 2) / z + this.cam.y];
  }

  /* Resize by a factor. Characters grow from their feet, so they stay standing
     on the floor of the background; the background grows from its centre. */
  resizeItem(it, k) {
    const r = it.ref;
    if (it.kind === 'char') {
      if (!r.sprite) return;
      const ow = r.sprite.width(), oh = r.sprite.height();
      r.sprite.scale = clamp(+(r.sprite.scale * k).toFixed(3), 0.05, 20);
      r.x += Math.round((ow - r.sprite.width()) / 2);
      r.y += Math.round(oh - r.sprite.height());
    } else {
      const ow = r.img.width * r.sx, oh = r.img.height * r.sy;
      r.sx = clamp(+(r.sx * k).toFixed(3), 0.02, 50);
      r.sy = clamp(+(r.sy * k).toFixed(3), 0.02, 50);
      r.x -= Math.round((r.img.width * r.sx - ow) / 2);
      r.y -= Math.round((r.img.height * r.sy - oh) / 2);
    }
  }

  arrangeUpdate() {
    const a = this.arrange, items = this.arrangeItems();
    if (a.msgT > 0) a.msgT -= 1 / 60;
    if (a.sel >= items.length) a.sel = 0;

    const [wx, wy] = this.screenToWorld(Input.mouse.x, Input.mouse.y);
    // C: the camera tool — set a fixed shot for this stage
    if (Input.just('KeyC')) {
      a.camMode = !a.camMode; a.grab = null;
      if (a.camMode && !this.fixedCam) {
        const w = this.wideShot();
        this.fixedCam = { x: Math.round(w.x), y: Math.round(w.y), zoom: +w.zoom.toFixed(3) };
      }
      if (a.camMode) this.arrangeFit(true);
      a.msg = a.camMode ? 'camera: drag to move the shot, wheel to zoom' : 'back to the characters'; a.msgT = 2.5;
    }
    if (a.camMode) { this.arrangeCamera(wx, wy); return; }
    if (Input.mouse.justDown) {
      for (let i = items.length - 1; i >= 0; i--) {          // topmost first
        const [x, y, w, h] = this.itemRect(items[i]);
        if (wx >= x && wx <= x + w && wy >= y && wy <= y + h) {
          a.sel = i;
          const r = items[i].ref;
          a.grab = [wx - r.x, wy - r.y];
          break;
        }
      }
    }
    if (!Input.mouse.down) a.grab = null;
    const it = items[a.sel], r = it.ref;
    if (a.grab) { r.x = Math.round(wx - a.grab[0]); r.y = Math.round(wy - a.grab[1]); }

    const shift = Input.down.has('ShiftLeft') || Input.down.has('ShiftRight');
    const step = shift ? 10 : 1;
    if (Input.just('ArrowLeft'))  r.x -= step;
    if (Input.just('ArrowRight')) r.x += step;
    if (Input.just('ArrowUp'))    r.y -= step;
    if (Input.just('ArrowDown'))  r.y += step;

    // resize: mouse wheel, or - and =
    let k = 1;
    if (Input.just('Equal')) k *= shift ? 1.01 : 1.05;
    if (Input.just('Minus')) k /= shift ? 1.01 : 1.05;
    if (Input.mouse.wheel) k *= Math.pow(1.05, -Input.mouse.wheel / 100);
    if (k !== 1) this.resizeItem(it, k);
    if (Input.just('KeyH') && it.kind === 'char') {
      r.setFlip(!r.flipped);
      a.msg = it.label + (r.flipped ? ' flipped' : ' facing normally'); a.msgT = 1.5;
    }

    if (Input.just('Tab')) a.sel = (a.sel + 1) % items.length;
    if (Input.just('KeyF')) this.arrangeFit(shift);
    if (Input.just('KeyR')) {
      const st = this.stage;
      for (const [key, c, p] of [['bf', this.bf, st.bf], ['dad', this.dad, st.dad], ['gf', this.gf, st.gf]]) {
        if (c.sprite) c.sprite.scale = (st.scales && typeof st.scales[key] === 'number') ? st.scales[key] : (c.baseScale || 1);
        c.setFlip(!!(st.flips && st.flips[key]));
        c.x = p[0] + (c.posOffset ? c.posOffset[0] : 0);
        c.y = p[1] + (c.posOffset ? c.posOffset[1] : 0);
      }
      for (const l of [...this.layers, ...this.frontLayers]) if (l.orig) Object.assign(l, l.orig);
      if (!this.meta.modDir) clearArrangement(st.name);
      this.fixedCam = st.fixedCam ? Object.assign({}, st.fixedCam) : null;
      a.msg = 'reset'; a.msgT = 2;
    }
    if (Input.just('KeyS')) this.saveStageFile();
    for (const c of [this.bf, this.dad, this.gf]) c.sprite && c.sprite.update(1 / 60);
    this.cam.lockPos = this.cam.lockZoom = true;
  }

  arrangeCamera(wx, wy) {
    const a = this.arrange, fc = this.fixedCam;
    const shift = Input.down.has('ShiftLeft') || Input.down.has('ShiftRight');
    if (Input.mouse.justDown) a.grab = [wx - fc.x, wy - fc.y];
    if (!Input.mouse.down) a.grab = null;
    if (a.grab) { fc.x = Math.round(wx - a.grab[0]); fc.y = Math.round(wy - a.grab[1]); }
    const step = shift ? 10 : 1;
    if (Input.just('ArrowLeft'))  fc.x -= step;
    if (Input.just('ArrowRight')) fc.x += step;
    if (Input.just('ArrowUp'))    fc.y -= step;
    if (Input.just('ArrowDown'))  fc.y += step;
    let k = 1;                                 // wheel up / = zooms in
    if (Input.just('Equal')) k *= shift ? 1.01 : 1.05;
    if (Input.just('Minus')) k /= shift ? 1.01 : 1.05;
    if (Input.mouse.wheel) k *= Math.pow(1.05, -Input.mouse.wheel / 100);
    if (k !== 1) fc.zoom = clamp(+(fc.zoom * k).toFixed(3), 0.1, 4);
    if (Input.just('KeyF')) this.arrangeFit(true);
    if (Input.just('KeyS')) this.saveStageFile();
    if (Input.just('KeyR')) {
      const o = this.stage.fixedCam;
      this.fixedCam = o ? Object.assign({}, o) : null;
      if (!this.fixedCam) a.camMode = false;
      a.msg = 'camera reset'; a.msgT = 2;
    }
    if (Input.just('Backspace') || Input.just('Delete')) {
      this.fixedCam = null; a.camMode = false; a.grab = null;
      a.msg = 'camera removed — it follows the song again'; a.msgT = 3;
    }
    for (const c of [this.bf, this.dad, this.gf]) c.sprite && c.sprite.update(1 / 60);
    this.cam.lockPos = this.cam.lockZoom = true;
  }

  saveStageFile() {
    const a = this.arrange, txt = this.stageFileText();
    if (this.meta.modDir) {
      a.msg = downloadText('stage.js', txt)
        ? 'downloaded stage.js — put it in ' + this.meta.modDir
        : 'could not download — the file is in the console (F12)';
    } else {
      saveArrangement(this.stage.name, this.arrangeObj());
      a.msg = 'saved in this browser (only mods get a stage.js file)';
    }
    a.msgT = 5;
    try { if (navigator.clipboard) navigator.clipboard.writeText(txt).catch(() => {}); } catch (e) {}
    console.log(txt);
  }

  // stage spots exclude a character's own `position` nudge, which load re-adds
  arrangeObj() {
    const pos = c => [Math.round(c.x - (c.posOffset ? c.posOffset[0] : 0)),
                      Math.round(c.y - (c.posOffset ? c.posOffset[1] : 0))];
    const size = c => c.sprite ? +c.sprite.scale.toFixed(3) : 1;
    const layers = {};
    for (const l of [...this.layers, ...this.frontLayers])
      layers[l.key] = { x: Math.round(l.x), y: Math.round(l.y), sx: l.sx, sy: l.sy };
    return { bf: pos(this.bf), dad: pos(this.dad), gf: pos(this.gf),
             scales: { bf: size(this.bf), dad: size(this.dad), gf: size(this.gf) }, layers,
             flips: { bf: !!this.bf.flipped, dad: !!this.dad.flipped, gf: !!this.gf.flipped },
             camera: this.fixedCam ? Object.assign({}, this.fixedCam) : null };
  }

  // stage.js: short, readable, and fine to edit by hand
  stageFileText() {
    const st = this.stage, o = this.arrangeObj();
    const f = v => +(+v).toFixed(3);
    const spot = k => '{ x: ' + o[k][0] + ', y: ' + o[k][1] + ', scale: ' + f(o.scales[k]) + (o.flips[k] ? ', flip: true' : '') + ' }';
    const size = l => l.sx === l.sy ? String(f(l.sx)) : '[' + f(l.sx) + ', ' + f(l.sy) + ']';
    const L = [
      '/* Stage layout for this mod, made with the E editor in H-Slice.',
      '   Keep it in the mod\'s folder beside mod.js; it loads automatically.',
      '   To change it, press E in game, arrange, then S to save a new one. */',
      'HSLICE.stage(' + JSON.stringify(st.name) + ', {',
    ];
    if (Math.abs((st.zoom || 0) - CONFIG.stage.zoom) > 1e-6) L.push('  zoom: ' + f(st.zoom) + ',');
    L.push('  bf:  ' + spot('bf') + ',');
    L.push('  gf:  ' + spot('gf') + ',');
    L.push('  dad: ' + spot('dad') + ',');
    if (this.fixedCam)
      L.push('  camera: { x: ' + Math.round(this.fixedCam.x) + ', y: ' + Math.round(this.fixedCam.y) + ', zoom: ' + f(this.fixedCam.zoom) + ' },');
    const all = [...this.layers, ...this.frontLayers];
    const plain = l => !l.front && l.scrollX === 1 && l.scrollY === 1 && (l.alpha ?? 1) === 1 && !l.flipX && !l.flipY;
    if (all.length === 1 && plain(all[0])) {
      const l = all[0];
      L.push('  bg:  { image: ' + JSON.stringify(l.src) + ', x: ' + Math.round(l.x) + ', y: ' + Math.round(l.y) + ', scale: ' + size(l) + ' },');
    } else if (all.length) {
      L.push('  layers: [');
      for (const l of all) {
        const p = ['image: ' + JSON.stringify(l.src), 'x: ' + Math.round(l.x), 'y: ' + Math.round(l.y), 'scale: ' + size(l)];
        if (l.scrollX !== 1 || l.scrollY !== 1)
          p.push('scroll: ' + (l.scrollX === l.scrollY ? f(l.scrollX) : '[' + f(l.scrollX) + ', ' + f(l.scrollY) + ']'));
        if ((l.alpha ?? 1) !== 1) p.push('alpha: ' + f(l.alpha));
        if (l.flipX) p.push('flipX: true');
        if (l.flipY) p.push('flipY: true');
        if (l.front) p.push('front: true');
        L.push('    { ' + p.join(', ') + ' },');
      }
      L.push('  ],');
    }
    L.push('});');
    return L.join('\n') + '\n';
  }

  drawArrange() {
    const a = this.arrange, items = this.arrangeItems();
    ctx.save();
    this.cam.apply(ctx);
    const z = this.cam.zoom;
    items.forEach((it, i) => {
      const [x, y, w, h] = this.itemRect(it);
      const on = i === a.sel;
      ctx.lineWidth = (on ? 3 : 2) / z;
      ctx.setLineDash(it.kind === 'layer' && !on ? [10 / z, 8 / z] : []);
      ctx.strokeStyle = on ? '#ff5ea8' : it.kind === 'layer' ? 'rgba(120,200,255,.35)' : 'rgba(255,255,255,.3)';
      ctx.strokeRect(x, y, w, h);
      if (on || it.kind === 'char') {
        ctx.fillStyle = on ? '#ff5ea8' : 'rgba(255,255,255,.45)';
        ctx.font = 'bold ' + Math.round(22 / z) + 'px "Trebuchet MS", sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(it.label, x + 4 / z, y - 8 / z);
      }
    });
    if (this.fixedCam) {
      const fc = this.fixedCam, fw = W / fc.zoom, fh = H / fc.zoom, fx = fc.x - fw / 2, fy = fc.y - fh / 2;
      if (a.camMode) {
        ctx.fillStyle = 'rgba(0,0,0,.55)';
        const B = 1e5;
        ctx.fillRect(fx - B, fy - B, fw + 2 * B, B);
        ctx.fillRect(fx - B, fy + fh, fw + 2 * B, B);
        ctx.fillRect(fx - B, fy, B, fh);
        ctx.fillRect(fx + fw, fy, B, fh);
      }
      ctx.setLineDash(a.camMode ? [] : [14 / z, 10 / z]);
      ctx.lineWidth = (a.camMode ? 4 : 2) / z;
      ctx.strokeStyle = a.camMode ? '#5dd6ff' : 'rgba(93,214,255,.5)';
      ctx.strokeRect(fx, fy, fw, fh);
      ctx.fillStyle = a.camMode ? '#5dd6ff' : 'rgba(93,214,255,.6)';
      ctx.font = 'bold ' + Math.round(22 / z) + 'px "Trebuchet MS", sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('camera', fx + 6 / z, fy - 8 / z);
    }
    ctx.setLineDash([]);
    ctx.restore();

    const it = items[a.sel] || items[0], r = it.ref;
    const size = it.kind === 'char' ? (r.sprite ? r.sprite.scale : 1) : r.sx;
    ctx.save();
    ctx.fillStyle = 'rgba(8,4,14,.84)';
    roundRect(ctx, 20, 20, 520, 196, 10); ctx.fill();
    const fc = this.fixedCam, camOn = !!(a.camMode && fc);
    text(camOn ? 'CAMERA' : 'ARRANGE', 40, 54, 24, camOn ? '#5dd6ff' : '#ff5ea8', 'left', 'bold', 4);
    text(camOn ? 'fixed shot for this stage' : it.label, 40, 90, 22, '#fff', 'left', 'bold', 3);
    text(camOn ? 'x ' + Math.round(fc.x) + '     y ' + Math.round(fc.y) + '     zoom ' + (+fc.zoom.toFixed(2))
               : 'x ' + Math.round(r.x) + '     y ' + Math.round(r.y) + '     size ' + (+size.toFixed(2)) + (it.kind === 'char' && r.flipped ? '     flipped' : ''),
         40, 120, 18, '#cbbfe0', 'left', 'normal', 0);
    text(camOn ? 'drag to move  ·  mouse wheel or - / = to zoom  ·  backspace removes it'
               : 'drag to move  ·  mouse wheel or - / = to resize  ·  H flip  ·  tab to switch', 40, 156, 14, '#7d7092', 'left', 'normal', 0);
    text((this.meta.modDir ? 'S save stage.js' : 'S save') + '  ·  C ' + (camOn ? 'characters' : 'camera') + '  ·  R reset  ·  F fit  ·  E exit',
         40, 180, 14, '#7d7092', 'left', 'normal', 0);
    if (a.msgT > 0) text(a.msg, 40, 246, 18, '#7ee3a0', 'left', 'bold', 4);
    ctx.restore();
  }

  drawPause() {
    ctx.fillStyle = 'rgba(6,3,12,.82)'; ctx.fillRect(0, 0, W, H);
    text('paused', 90, 180, 56, '#fff', 'left', 'bold', 8);
    ['resume', 'restart', 'quit to freeplay'].forEach((it, i) => {
      const on = i === this.pauseSel;
      text(it, 90, 300 + i * 74, on ? 44 : 34, on ? '#ff5ea8' : '#7d7092', 'left', 'bold', on ? 6 : 4);
    });
    text('enter selects · esc resumes', 90, H - 80, 20, '#584d6d', 'left', 'normal', 0);
  }
}
function rnd(a, b) { return a + Math.random() * (b - a); }
function ratingColor(r) { return { sick: '#5dd6ff', good: '#6ef08a', bad: '#ffb347', shit: '#ff5f5f' }[r] || '#fff'; }
function rank(a) {
  if (a >= 100) return 'perfect';
  if (a >= 95) return 's';
  if (a >= 90) return 'a';
  if (a >= 80) return 'b';
  if (a >= 70) return 'c';
  if (a > 0) return 'd';
  return '—';
}

/* =========================================================== GAME OVER == */
/* engineassets/songs/gameOver.ogg, looping. Kept out of the menu-music scan. */
async function gameOverMusic() {
  for (const n of ['gameOver', 'gameover', 'game_over', 'gameOverMusic']) for (const e of AUDIO_EXT) {
    const k = vfsKeyCI('engine/songs/' + n + e);
    const url = k ? VFS.url(k) : CONFIG.paths.engine + 'songs/' + n + e;
    if (url && await probeAudioUrl(url)) {
      const a = new Audio(url); a.loop = true; a.volume = CONFIG.engine.menuVolume ?? 0.6;
      return a;
    }
  }
  return null;
}

class GameOverState {
  enter(meta, diff, story) {
    this.story = story || null;
    this.meta = meta; this.diff = diff; this.t = 0; this.alive = true; this.img = null; this.music = null;
    Game.audio.sfx('gameOverSFX', 0.8);
    // engineassets/images/gameover.png — a transparent png of the dead Boyfriend
    engineImage(['gameover', 'gameOver', 'game_over', 'bfDead', 'blueballed']).then(i => { this.img = i; });
    gameOverMusic().then(m => {
      if (!m || !this.alive) return;        // none, or retried before it finished loading
      this.music = m; m.play().catch(() => {});
    });
  }
  exit() { this.alive = false; if (this.music) { this.music.pause(); this.music = null; } }
  update(dt) {
    this.t += dt;
    if (Input.just('Enter') || Input.just('Space')) Game.set(new PlayState(), this.meta, this.diff, '', this.story);
    if (Input.just('Escape')) Game.set(new FreeplayState());
  }
  draw() {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
    if (this.img) {
      const k = Math.min((H * 0.72) / this.img.height, (W * 0.8) / this.img.width, 1.5);
      const w = this.img.width * k, h = this.img.height * k;
      ctx.save(); ctx.globalAlpha = Math.min(1, this.t / 0.6);
      ctx.drawImage(this.img, (W - w) / 2, (H - h) / 2 - 36, w, h);
      ctx.restore();
    } else text('blue balled', W / 2, H / 2 - 20, 70, '#ff5ea8', 'center', 'bold', 9);
    ctx.save(); ctx.globalAlpha = 0.55 + Math.sin(this.t * 4) * 0.45;
    text('enter to retry', W / 2, H - 64, 32, '#fff', 'center', 'bold', 5);
    ctx.restore();
  }
}

/* ============================================================= RESULTS == */
class ResultsState {

}

/* ============================================================ MAIN LOOP = */
let last = performance.now(), fpsAcc = 0, fpsN = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  fpsAcc += dt; fpsN++;
  if (fpsAcc >= 0.5) { Game.fps = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; }

  // ` as well as F3: on many laptops F3 is a media key unless Fn is held.
  if (Input.just('F3') || Input.just('Backquote')) Game.debug = !Game.debug;

  // One place handles menu music for every screen, so no state has to remember.
  if (userGestured) { if (menuMusicWanted()) Music.play(); else Music.stop(); }

  // Menu sounds, handled in one place so no screen has to remember them.
  if (userGestured && Game.state) {
    const inMenu = Game.stateName !== 'PlayState' || Game.state.paused;
    if (inMenu) {
      if (Input.just('ArrowUp') || Input.just('ArrowDown') || Input.just('ArrowLeft') ||
          Input.just('ArrowRight') || Input.just('Tab') || Input.just('KeyW') || Input.just('KeyS'))
        SFX.play('scroll');
      else if (Input.just('Enter') || Input.just('Space')) SFX.play('confirm');
      else if (Input.just('Escape')) SFX.play('cancel');
    }
  }

  if (Game.state) {
    if (Game.state.update) Game.state.update(dt);
    if (Game.state.draw) Game.state.draw();
  }
  if (Game.debug) drawDebug();
  Input.endFrame();
  requestAnimationFrame(loop);
}
function drawDebug() {
  const s = Game.state;
  const lines = [
    `h-slice ${BUILD} · ${Game.fps} fps · ${Game.stateName}  (F3 or \u0060 closes)`,
    `vfs ${VFS.size} files · missing ${Assets.missing.size}`,
    `menu music: ${Music.status}${Music.failed ? '  (engineassets/songs/)' : ''}`,
  ];
  if (s instanceof PlayState && s.conductor) {
    lines.push(`pos ${s.conductor.songPosition | 0}ms / ${s.songLength | 0}ms`);
    lines.push(`bpm ${s.conductor.bpm} · step ${s.conductor.step} · speed ${s.speed}`);
    for (const c of [s.bf, s.dad, s.gf])
      if (c) lines.push(`${c.name}: ${c.loadError || (c.sprite ? 'ok, ' + Object.keys(c.sprite.anims).length + ' anims' : 'placeholder')}`);
    lines.push('audio: ' + (Game.audio.audioFound || '?'));
    lines.push('looked for: ' + (Game.audio.vocalsWanted || '?'));
    lines.push(`notes ${s.notes ? s.notes.length : 0} · audio ${Game.audio.virtual ? 'virtual clock' : 'webaudio'}`);
  }
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(8, 8, 720, 20 * lines.length + 12);
  lines.forEach((l, i) => text(l, 18, 28 + i * 20, 15, '#9ff', 'left', 'normal', 0));
  ctx.restore();
}

/* ============================================================== BOOT ==== */
/* Normalises whatever got dropped into VFS keys rooted at the assets folder,
   so "assets/", "MyMod/assets/", a bare "songs/" folder and a .fnfc all land
   in the same namespace. */
function vfsKey(rel) {
  rel = norm(rel);
  // engineassets/ must be tested first: it *contains* "assets/", so the
  // lastIndexOf below would otherwise strip it into the mod namespace.
  const eng = rel.toLowerCase().lastIndexOf('engineassets/');
  if (eng >= 0) return 'engine/' + rel.slice(eng + 13);
  const i = rel.toLowerCase().lastIndexOf('assets/');
  if (i >= 0) return rel.slice(i + 7);
  // mod layouts: strip a leading wrapper dir until we hit a known top folder
  const known = /^(data|images|songs|sounds|music|videos|fonts|shared|characters|stages)\//i;
  const parts = rel.split('/');
  for (let k = 0; k < parts.length; k++) {
    const tail = parts.slice(k).join('/');
    if (known.test(tail)) return tail;
  }
  return parts.length > 1 ? parts.slice(1).join('/') : rel;
}

async function ingest(files, { replace = false } = {}) {
  if (replace) VFS.clear();
  for (const f of files) {
    const rel = f.webkitRelativePath || f.name;
    if (/\.fnfc$/i.test(rel)) { await ingestFnfc(f); continue; }
    VFS.add(vfsKey(rel), f);
  }
  Assets.images.clear(); Assets.atlases.clear(); Assets.json.clear();
  Assets.buffers.clear(); Assets.missing.clear();
  await discoverSongs();
  Game.set(new TitleState());
}

/* A .fnfc holds one song's files flat (or under manifest-declared dirs).
   Everything gets re-homed under songs/<id>/ so the normal loader finds it. */
async function ingestFnfc(file) {
  let entries;
  try { entries = await readZip(file); }
  catch (e) { console.warn('could not read', file.name, e); return; }
  const metaEntry = entries.find(e => /-metadata(-[^/.]+)?\.json$/i.test(e.name));
  const id = metaEntry
    ? metaEntry.name.split('/').pop().replace(/-metadata(-[^/.]+)?\.json$/i, '')
    : file.name.replace(/\.fnfc$/i, '');
  for (const e of entries) {
    const base = e.name.split('/').pop();
    if (base === 'manifest.json') continue;
    VFS.add(`songs/${id}/${base}`, e.blob);
  }
}

document.getElementById('fdir').addEventListener('change', e => {
  if (e.target.files.length) ingest([...e.target.files], { replace: true });
});
document.getElementById('ffile').addEventListener('change', e => {
  if (e.target.files.length) ingest([...e.target.files]);
});
const dropEl = document.getElementById('drop');
addEventListener('dragover', e => { e.preventDefault(); dropEl.classList.add('on'); });
addEventListener('dragleave', e => { if (e.relatedTarget === null) dropEl.classList.remove('on'); });
addEventListener('drop', async e => {
  e.preventDefault(); dropEl.classList.remove('on');
  const out = [];
  const walk = async (entry, path) => {
    if (entry.isFile) {
      const f = await new Promise(r => entry.file(r));
      Object.defineProperty(f, 'webkitRelativePath', { value: path + f.name });
      out.push(f);
    } else if (entry.isDirectory) {
      const rd = entry.createReader();
      let batch;
      do {
        batch = await new Promise(r => rd.readEntries(r));
        for (const en of batch) await walk(en, path + entry.name + '/');
      } while (batch.length);
    }
  };
  const items = [...e.dataTransfer.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (items.length) { for (const it of items) await walk(it, ''); await ingest(out); }
  else if (e.dataTransfer.files.length) await ingest([...e.dataTransfer.files]);
});

// Browsers keep the audio context suspended until the user interacts, so the
// menu loop can only begin here. Either gesture works; whichever lands first.
let userGestured = false;
const unlockAudio = () => { userGestured = true; try { Game.audio.ensureCtx(); } catch (e) {} };
addEventListener('keydown', unlockAudio, { once: true });
addEventListener('pointerdown', unlockAudio, { once: true });

/* Loads every .fnfc sitting in fnfc/ next to index.html. A browser cannot list
   a remote directory, so we try two things: an optional fnfc/list.json, and
   the HTML index most static servers (python -m http.server, nginx autoindex)
   return for a bare directory request. Either way, no manual wiring. */
async function autoLoadFnfc() {
  const dir = CONFIG.paths.fnfc;
  let names = [];
  try {
    const r = await fetch(dir + 'list.json');
    if (r.ok) { const j = await r.json(); if (Array.isArray(j)) names = j.slice(); }
  } catch (e) { /* no manifest, try the directory index */ }
  if (!names.length) {
    try {
      const r = await fetch(dir);
      if (r.ok) {
        const html = await r.text();
        names = [...html.matchAll(/href="([^"?]+\.fnfc)"/gi)]
          .map(m => decodeURIComponent(m[1].split('/').pop()));
      }
    } catch (e) { /* not served, or no index — fine */ }
  }
  let n = 0;
  for (const name of [...new Set(names)]) {
    try {
      const r = await fetch(dir + name);
      if (!r.ok) continue;
      // readZip only needs arrayBuffer(); ingestFnfc only needs .name. Tagging
      // the blob avoids a File wrap that some environments get wrong.
      const blob = await r.blob();
      try { blob.name = name; } catch (e) { /* fall back to the id in the zip */ }
      await ingestFnfc(blob.name ? blob : Object.assign({ name }, blob));
      n++;
    } catch (e) { console.warn('[h-slice] could not load', name, e); }
  }
  if (n) { Assets.json.clear(); Assets.buffers.clear(); Assets.missing.clear(); }
  return n;
}

Input.init();
// sprites.js carries atlas XML for file://; mods.js lists songs. Both optional.
HSLICE.load(CONFIG.paths.engine + 'sprites.js', { quiet: true }).catch(() => {});
HSLICE.load(CONFIG.paths.engine + 'weeks.js', { quiet: true }).catch(() => {});
HSLICE.load(CONFIG.paths.engine + 'mods.js', { quiet: true }).then(() => HSLICE.ready()).catch(() => {});
autoLoadFnfc()
  .then(n => { if (n) console.log('[h-slice] loaded ' + n + ' .fnfc from ' + CONFIG.paths.fnfc); })
  .catch(() => {})
  .then(() => discoverSongs())
  .catch(() => {});
Game.set(new TitleState());
requestAnimationFrame(loop);
