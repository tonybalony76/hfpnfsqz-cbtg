<style>

  #boot { position:fixed; left:12px; bottom:12px; font-size:12px; color:#7d6f90; line-height:1.6; }
  #boot button { font:inherit; font-size:12px; background:#241b30; color:#d6c9e8; border:1px solid #3d2f52;
    border-radius:4px; padding:4px 9px; cursor:pointer; }
  #boot button:hover { background:#2f2440; }
  #boot input { display:none; }
</style>
</head>

/* Named *Arrangement, not *Stage: there is already an async loadStage(name)
   further down for stage JSON, and a duplicate declaration silently wins. */
// Saved per stage: a layout tuned for one stage must never move another.
function arrangeKey(stage) { return 'hslice.arrange.' + (stage || 'default'); }
function loadArrangement(stage) {
  try { return JSON.parse(localStorage.getItem(arrangeKey(stage)) || 'null'); } catch (e) { return null; }
}
function saveArrangement(stage, v) {
  try { localStorage.setItem(arrangeKey(stage), JSON.stringify(v)); } catch (e) {}
}
function clearArrangement(stage) {
  try { localStorage.removeItem(arrangeKey(stage)); } catch (e) {}
}
function saveOpts() { try { localStorage.setItem('hslice.opts', JSON.stringify(OPT)); } catch (e) {} }

/* ================================================================ VFS ==== */
/* Files dropped or picked from a folder shadow the network. Lets the engine
   run from file:// where fetch() is blocked. */
const VFS = {
  files: new Map(),         // 'images/ui/NOTE_assets.png' -> File
  urls:  new Map(),
  has(p) { return this.files.has(norm(p)); },
  add(path, file) {
    const p = norm(path).replace(/^assets\//, '');
    this.files.set(p, file);
  },
  url(p) {
    p = norm(p).replace(/^assets\//, '');
    if (!this.files.has(p)) return null;
    if (!this.urls.has(p)) this.urls.set(p, URL.createObjectURL(this.files.get(p)));
    return this.urls.get(p);
  },
  file(p) { return this.files.get(norm(p).replace(/^assets\//, '')) || null; },
  keys() { return [...this.files.keys()]; },
  clear() {
    for (const u of this.urls.values()) { try { URL.revokeObjectURL(u); } catch (e) {} }
    this.files.clear(); this.urls.clear();
  },
  get size() { return this.files.size; },
};
function norm(p) { return String(p).replace(/\\/g, '/').replace(/^\.?\//, ''); }

/* ============================================================== LOADER === */
/* Sparrow XML is a text file, so it needs fetch — which file:// blocks.
   A .js file can register the XML string here instead. Images are fine

const MOD_ROOTS = new Set();   // folders that hold a mod, whose art sits flat inside
const BAKED = {
  xml: new Map(),      // raw Sparrow xml, registered by a .js file
  frames: new Map(),   // pre-parsed frame tables compiled into the engine

  /* Compact sheet data: [[prefix, [idx,x,y,w,h,frameX,frameY,frameW,frameH, ...]], ...]
     Frame names rebuild as prefix + a 4-digit index, which is how Sparrow
     names them. This is the same data as the .xml, ~4x smaller, and it lives
     in the engine so the built-in characters need no xml file at all. */
  sheet(name, groups) {
    const out = [];
    for (const [prefix, n] of groups) {
      for (let i = 0; i < n.length; i += 9) {
        out.push({
          name: n[i] < 0 ? prefix : prefix + String(n[i]).padStart(4, '0'),
          x: n[i+1], y: n[i+2], w: n[i+3], h: n[i+4],
          fx: n[i+5], fy: n[i+6], fw: n[i+7], fh: n[i+8], rot: false,
        });
      }
    }
    out.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    this.frames.set(norm(name), out);
  },
};
function onFileProtocol() {

const Assets = {
  images: new Map(), atlases: new Map(), json: new Map(), buffers: new Map(),
  missing: new Set(),

  async image(path) {
    path = norm(path);
    if (this.images.has(path)) return this.images.get(path);
    const src = VFS.url(path) || path;
    const img = await new Promise(res => {
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = () => res(null);
      i.src = src;
    });
    if (!img) this.missing.add(path);
    this.images.set(path, img);
    return img;
  },

  async text(path) {
    path = norm(path);
    const f = VFS.file(path);
    if (f) return await f.text();
    try {
      const r = await fetch(path);
      if (!r.ok) throw 0;
      return await r.text();
    } catch (e) { this.missing.add(path); return null; }
  },

  async jsonFile(path) {
    path = norm(path);
    if (this.json.has(path)) return this.json.get(path);
    const t = await this.text(path);
    let v = null;
    if (t) { try { v = JSON.parse(t); } catch (e) { console.warn('bad json', path, e); } }
    this.json.set(path, v);
    return v;
  },

  async bytes(path) {
    path = norm(path);
    const f = VFS.file(path);
    if (f) return await f.arrayBuffer();
    try {
      const r = await fetch(path);
      if (!r.ok) throw 0;
      return await r.arrayBuffer();
    } catch (e) { this.missing.add(path); return null; }
  },

  /* Try the same relative path under each root in turn. Returns
     {data, path} for the first hit, or null. */
  async findJson(roots, rel) {
    for (const r of roots) {
      const v = await this.jsonFile(r + rel);
      if (v) return { data: v, path: r + rel, root: r };
    }
    return null;
  },
  async findBytes(roots, rel) {
    for (const r of roots) {
      const v = await this.bytes(r + rel);
      if (v) return { data: v, path: r + rel, root: r };
    }
    return null;
  },

  /* base = path without extension; expects base.png + base.xml */
  atlasWhy: new Map(),

  /* A Sparrow atlas is two files and either half can be the one that's
     missing, so record which — "sheet missing" on its own is useless.
     Servers are case-sensitive and sheets get renamed, so try a few
     spellings of the filename before giving up. */
  async atlas(base, opts) {
    const quiet = !!(opts && opts.quiet);
    base = norm(base);
    if (this.atlases.has(base)) return this.atlases.get(base);
    const cut = base.lastIndexOf('/') + 1;
    const dir = base.slice(0, cut), file = base.slice(cut);
    const variants = [...new Set([file, file.toLowerCase(), file.toUpperCase(),
                                  file.charAt(0).toUpperCase() + file.slice(1).toLowerCase()])];
    let img = null, xml = BAKED.xml.get(base) || null;
    const tried = [];
    outer:
    for (const root of CONFIG.roots.images) {
      for (const v of variants) {
        // mods keep their art beside mod.js, so also try the file flat in the root
        for (const p of ((MOD_ROOTS.has(root) || root.startsWith('mods/')) ? [root + dir + v, root + v] : [root + dir + v])) {
          if (!img) { tried.push(p + '.png'); img = await this.image(p + '.png'); }
          if (!xml) { tried.push(p + '.xml'); xml = await this.text(p + '.xml'); }
          if (img && xml) break outer;
        }
      }
    }
    const src = xml || BAKED.frames.get(base) || null;
    const a = (img && src) ? new Sparrow(img, src) : null;
    if (!a) {
      const why = img ? (onFileProtocol() ? 'xml blocked by file://' : 'xml not found')
                : xml ? 'png not found'
                : (onFileProtocol() ? 'png + xml, file:// blocks xml' : 'png + xml not found');
      this.atlasWhy.set(base, why);
      if (!quiet) console.warn('[h-slice] atlas "' + base + '" — ' + why + '  (tried ' +
        tried.slice(0, 2).join(', ') + (tried.length > 2 ? ' +' + (tried.length - 2) + ' more' : '') + ')');
    }
    this.atlases.set(base, a);
    return a;
  },
  async findImage(roots, rel) {
    for (const r of roots) { const i = await this.image(r + rel); if (i) return i; }
    return null;
  },
};

/* ================================================== .FNFC (ZIP) READER === */
/* A .fnfc is a plain zip. Only stored (0) and deflate (8) entries exist in
   practice, and deflate-raw is native, so no library is needed. */
async function readZip(file) {
  const buf = await file.arrayBuffer();
  const dv = new DataView(buf);
  let eocd = -1;
  for (let i = buf.byteLength - 22; i >= 0 && i > buf.byteLength - 66000; i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('not a zip file');
  const count = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);
  const out = [];
  for (let i = 0; i < count; i++) {
    if (dv.getUint32(off, true) !== 0x02014b50) break;
    const method = dv.getUint16(off + 10, true);
    const csize  = dv.getUint32(off + 20, true);
    const nlen   = dv.getUint16(off + 28, true);
    const elen   = dv.getUint16(off + 30, true);
    const clen   = dv.getUint16(off + 32, true);
    const lho    = dv.getUint32(off + 42, true);
    const name   = new TextDecoder().decode(new Uint8Array(buf, off + 46, nlen));
    off += 46 + nlen + elen + clen;
    if (name.endsWith('/')) continue;
    const lnlen = dv.getUint16(lho + 26, true);
    const lelen = dv.getUint16(lho + 28, true);
    const raw = new Uint8Array(buf, lho + 30 + lnlen + lelen, csize);
    let bytes;
    if (method === 0) bytes = raw;
    else if (method === 8) {
      const ds = new DecompressionStream('deflate-raw');
      bytes = new Uint8Array(await new Response(
        new Blob([raw]).stream().pipeThrough(ds)).arrayBuffer());
    } else continue;                       // unsupported compression: skip
    out.push({ name, blob: new Blob([bytes]) });
  }
  return out;
}

/* ========================================================== DISCOVERY === */
/* Builds the freeplay list. With files in the VFS (dropped folder or .fnfc)
   it scans for <song>-metadata.json. Over http it reads an optional
   songList.json, since a browser cannot list a remote directory. */
const META_RX = /(?:^|\/)songs\/([^/]+)\/([^/]+)-metadata(?:-([^/.]+))?\.json$/i;

function tintFor(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return `hsl(${Math.abs(h) % 360} 45% 42%)`;
}

function enrich(entry, meta) {
  const pd = meta.playData || {};
  entry.name   = meta.songName || entry.id;
  entry.artist = meta.artist || '';
  entry.diffs  = (pd.difficulties && pd.difficulties.length) ? pd.difficulties.slice() : ['normal'];
  entry.icon   = (pd.characters && pd.characters.opponent) || 'dad';
  entry.stage  = pd.stage || '';
  entry.color  = entry.color || tintFor(entry.name);
  for (const v of pd.songVariations || [])
    if (!entry.variations.includes(v)) entry.variations.push(v);
  return entry;
}

async function discoverFromVFS() {
  const out = new Map();
  for (const key of VFS.keys()) {
    const m = key.match(META_RX);
    if (!m) continue;
    const [, folder, id, variation] = m;
    let e = out.get(folder);
    if (!e) { e = { folder, id, name: id, diffs: ['normal'], variations: [] }; out.set(folder, e); }
    if (variation) {                        // <song>-metadata-erect.json
      if (!e.variations.includes(variation)) e.variations.push(variation);
      continue;
    }
    const meta = await Assets.jsonFile('assets/' + key);
    if (meta) enrich(e, meta);
  }
  // legacy charts sitting in the same tree
  for (const key of VFS.keys()) {
    if (META_RX.test(key) || /-chart(-[^/.]+)?\.json$/i.test(key)) continue;
    const m = key.match(/(?:^|\/)songs\/([^/]+)\/([^/]+)\.json$/i);
    if (!m || out.has(m[1])) continue;
    const j = await Assets.jsonFile('assets/' + key);
    if (!j || ChartLoader.detect(j) !== 'legacy') continue;
    const s = j.song || j;
    out.set(m[1], { folder: m[1], id: m[1], name: s.song || m[1], diffs: ['normal'],
                    variations: [], icon: s.player2 || 'dad', color: tintFor(s.song || m[1]) });
  }
  return [...out.values()];
}

async function discoverSongs() {
  await HSLICE.ready().catch(() => {});   // mods register songs into CONFIG.songs
  let list = VFS.size ? await discoverFromVFS() : [];

  if (!list.length) {
    // http mode: optional manifest, otherwise CONFIG.songs
    const man = await Assets.findJson(['assets/data/', 'assets/'], 'songList.json');
    const seeds = (man && Array.isArray(man.data)) ? man.data : CONFIG.songs;
    for (const item of seeds) {
      const folder = typeof item === 'string' ? item : item.folder;
      if (!folder) continue;
      const id = (typeof item === 'object' && item.id) || folder;
      const e = Object.assign({ folder, id, name: folder, diffs: ['normal'], variations: [] },
                              typeof item === 'object' ? item : {});
      const meta = await Assets.findJson(CONFIG.roots.chart, `${folder}/${id}-metadata.json`);
      if (meta) enrich(e, meta.data);
      else {
        // Not V-Slice. Accept a legacy chart, otherwise the folder genuinely
        // is not there — drop it rather than listing a song that cannot load.
        const leg = await Assets.findJson(CONFIG.roots.chart, `${folder}/${id}.json`)
                 || await Assets.findJson(CONFIG.roots.chart, `${folder}/chart.json`);
        if (leg) {
          const s = leg.data.song || leg.data;
          e.name = s.song || e.name;
          e.icon = s.player2 || e.icon || 'dad';
        } else if (!e.builtin && !e.mod) {
          // e.mod carries its chart inline, so having no file on disk is normal
          console.warn('[h-slice] no chart found for "' + folder + '" — skipping');
          continue;
        }
      }
      e.color = e.color || tintFor(e.name);
      list.push(e);
    }
  }

  list.sort((a, b) => {
    const aw = a.weekIndex == null ? 99 : a.weekIndex, bw = b.weekIndex == null ? 99 : b.weekIndex;
    if (aw !== bw) return aw - bw;
    if (aw !== 99) return (a.songIndex || 0) - (b.songIndex || 0);
    return a.name.localeCompare(b.name);
  });
  if (list.length) CONFIG.songs = list;
  return CONFIG.songs;
}

/* ============================================================== STAGE === */
/* Reads a V-Slice stage JSON (data/stages/<name>.json) when present:
   props become layers sorted by zIndex, and character positions and camera
   offsets come straight from it. Falls back to CONFIG.stage. */
/* Finds a stage image. The playing mod's own folder is searched first, so two
   mods that both ship a "bg.png" can never pick up each other's. */
/* Hands the user a file. Works from file:// as well — nothing is fetched,
   the browser just saves a blob it already has. */
function downloadText(name, text) {
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'text/javascript' }));
    a.download = name;
    (document.body || document.documentElement).appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => { try { URL.revokeObjectURL(a.href); } catch (e) {} }, 4000);
    return true;
  } catch (e) { return false; }
}

async function findStageImage(src, roots) {
  if (!src) return null;
  const clean = String(src).replace(/^images\//, '');
  const names = /\.(png|jpe?g|webp|gif)$/i.test(clean) ? [clean] : [clean + '.png', clean + '.jpg', clean + '.webp'];
  const all = [...roots, ...CONFIG.roots.images, ...CONFIG.roots.images.map(r => r + 'stages/')];
  for (const r of [...new Set(all)])
    for (const n of names) { const img = await Assets.image(r + n); if (img) return img; }
  return null;
}

// every supported layer shape comes out as one
function makeLayer(img, it, i) {
  const num  = (v, d) => (typeof v === 'number' && isFinite(v)) ? v : d;
  const pair = (v, d) => Array.isArray(v) ? [num(v[0], d), num(v[1] ?? v[0], d)] : [num(v, d), num(v, d)];
  const [sx, sy] = pair(it.scale, 1);
  const [scrollX, scrollY] = pair(it.scroll, 1);
  return { img, src: it.src, name: it.name || '', key: it.name || it.src || ('#' + i),
           x: num(it.x, 0), y: num(it.y, 0), sx, sy, scrollX, scrollY,
           alpha: num(it.alpha, 1), flipX: !!it.flipX, flipY: !!it.flipY, front: !!it.front };
}
function layerLabel(l) { return l.name || String(l.src || 'layer').split('/').pop(); }

/* Stage sources, first match wins:
     1. HSLICE.stage(name, {...}) from a mod's .js — the only one that works on file://
     2. a V-Slice data/stages/<name>.json
     3. CONFIG.stage
   Both the simple { layers:[...] } form and V-Slice { props, characters,
   cameraZoom } are accepted, so a V-Slice stage json can be pasted in as-is. */
async function loadStage(name, extraRoots, modDir) {
  const base = CONFIG.stage;
  const roots = (extraRoots || []).slice();
  const st = {
    name: name || 'default',
    layers: [], front: [],
    zoom: base.zoom, zoomScale: base.zoomScale || 1,
    camera: base.camera.slice(),
    bf: base.bf.slice(), dad: base.dad.slice(), gf: base.gf.slice(),
    charOffsets: {}, scales: {}, flips: {}, defined: false,
  };
  let i = 0;
  for (const l of base.layers || []) {
    const img = await findStageImage(l.img || l.image, roots);
    if (img) st.layers.push(makeLayer(img, Object.assign({}, l, { src: l.img || l.image }), i++));
  }
  if (!name) return st;

  // the playing mod's own stage.js first, so two mods that both name their
  // stage "basement" can never load each other's
  let s = (modDir && HSLICE.stagesByDir.get(modDir)) || HSLICE.stages.get(name) || null;
  if (s) { if (s.dir) roots.unshift(s.dir); }
  else {
    const found = await Assets.findJson(CONFIG.roots.stages, name + '.json');
    if (found) s = found.data;
  }
  if (!s) return st;
  st.defined = true;

  const zoom = typeof s.zoom === 'number' ? s.zoom : s.cameraZoom;
  if (typeof zoom === 'number') st.zoom = zoom;
  if (Array.isArray(s.camera)) st.camera = s.camera.slice();
  // a fixed shot from the editor's camera tool: camera: { x, y, zoom }
  if (s.camera && !Array.isArray(s.camera) && typeof s.camera.x === 'number' && typeof s.camera.y === 'number')
    st.fixedCam = { x: s.camera.x, y: s.camera.y, zoom: typeof s.camera.zoom === 'number' ? s.camera.zoom : st.zoom };
  // a spot is [x, y], or { x, y, scale } the way the editor writes it
  for (const k of ['bf', 'dad', 'gf']) {
    const v = s[k];
    if (Array.isArray(v)) st[k] = v.slice();
    else if (v && typeof v === 'object') {
      if (typeof v.x === 'number' && typeof v.y === 'number') st[k] = [v.x, v.y];
      if (typeof v.scale === 'number') st.scales[k] = v.scale;
      if (v.flip) st.flips[k] = true;          // mirrored from how they normally face
    }
  }

  const chars = s.characters || {};
  let charZ = 0;
  for (const k of ['bf', 'dad', 'gf']) {
    const c = chars[k];
    if (!c) continue;
    if (Array.isArray(c.position)) st[k] = c.position.slice();
    if (Array.isArray(c.cameraOffsets)) st.charOffsets[k] = c.cameraOffsets.slice();
    if (typeof c.scale === 'number') st.scales[k] = c.scale;
    charZ = Math.max(charZ, c.zIndex || 0);
  }
  if (!charZ) charZ = 100;

  const items = [];
  // the editor's one-picture shorthand, drawn behind everything: bg: { image, x, y, scale }
  if (s.bg) items.push(Object.assign({ name: 'bg' }, s.bg, { src: s.bg.image || s.bg.img || 'bg' }));
  for (const l of s.layers || []) items.push(Object.assign({}, l, { src: l.image || l.img || l.assetPath }));
  for (const p of (s.props || []).slice().sort((a, b) => (a.zIndex || 0) - (b.zIndex || 0))) {
    const pos = p.position || [0, 0];
    items.push({ src: p.assetPath, name: p.name, x: pos[0], y: pos[1], scale: p.scale, scroll: p.scroll,
                 alpha: p.alpha, flipX: p.flipX, flipY: p.flipY, front: (p.zIndex || 0) > charZ });
  }
  st.layers = []; st.front = [];
  i = 0;
  for (const it of items) {
    if (!it.src) continue;
    const img = await findStageImage(it.src, roots);
    if (!img) { console.warn('[h-slice] stage "' + name + '": image not found — ' + it.src); continue; }
    const layer = makeLayer(img, it, i++);
    (layer.front ? st.front : st.layers).push(layer);
  }
  return st;
}

/* ============================================ SPARROW v2 TEXTURE ATLAS === */
class Sparrow {
  constructor(img, src) {
    this.img = img;
    // src is either Sparrow xml text or an already-parsed frame table
    if (Array.isArray(src)) { this.frames = src; this._cache = new Map(); return; }
    /* Sparrow sheets exported on Windows often start with a BOM. That's legal
       in a file, but once it's a string the BOM sits in front of <?xml, and a
       browser's strict parser then rejects the whole document — zero frames,
       no error thrown. Strip it, and if the parser still refuses, read the
       attributes straight off the text: they're all we ever needed. */
    const xmlText = String(src).replace(/^\uFEFF/, '').replace(/^\s+/, '');
    this.frames = [];
    const getters = [];
    try {
      const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
      if (!doc.getElementsByTagName('parsererror').length) {
        const subs = doc.getElementsByTagName('SubTexture');
        for (let i = 0; i < subs.length; i++) { const st = subs[i]; getters.push(n => st.getAttribute(n)); }
      }
    } catch (e) { /* fall through to the text scan */ }
    if (!getters.length) {
      for (const m of xmlText.matchAll(/<SubTexture\b([^>]*?)\/?>/g)) {
        const a = {};
        for (const kv of m[1].matchAll(/([\w:-]+)\s*=\s*"([^"]*)"/g)) a[kv[1]] = kv[2];
        getters.push(n => (n in a ? a[n] : null));
      }
      if (getters.length) console.warn('[h-slice] xml was rejected by the parser; read ' + getters.length + ' frames from the text instead');
    }
    for (const get of getters) {
      const num = n => { const v = get(n); return v === null ? null : parseFloat(v); };
      const w = num('width') || 0, h = num('height') || 0;
      this.frames.push({
        name: get('name') || '',
        x: num('x') || 0, y: num('y') || 0, w, h,
        fx: num('frameX') || 0, fy: num('frameY') || 0,
        fw: num('frameWidth') ?? w, fh: num('frameHeight') ?? h,
        rot: (get('rotated') || 'false') === 'true',
      });
    }
    // Sparrow sheets are authored in order; sort numerically so "x9" < "x10".
    this.frames.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    this._cache = new Map();
  }
  /* A prefix must be followed by the frame counter and nothing else.
     Plain startsWith is what Flixel does, and on real sheets it bleeds:
     "GF Dancing Beat" would also match "GF Dancing Beat Hair blowing0000",
     and "BF NOTE LEFT" would also match "BF NOTE LEFT MISS0000".
     Matching is case-insensitive and tolerates one separator before the
     digits, because sheets really do ship "GF left note" and "GF FEAR ". */
  byPrefix(prefix) {
    if (this._cache.has(prefix)) return this._cache.get(prefix);
    const p = String(prefix).toLowerCase();
    const strict = this.frames.filter(fr => {
      const n = fr.name.toLowerCase();
      if (!n.startsWith(p)) return false;
      const rest = fr.name.slice(prefix.length);
      return rest === '' || /^[ _\-]?\d+$/.test(rest);
    });
    // odd sheets exist; a loose match beats no animation at all
    const out = strict.length ? strict
              : this.frames.filter(fr => fr.name.toLowerCase().startsWith(p));
    this._cache.set(prefix, out);
    return out;
  }
}

/* ========================================================= ANIM SPRITE === */
class AnimSprite {
  constructor(atlas) {
    this.atlas = atlas || null;
    this.anims = Object.create(null);
    this.cur = null; this.idx = 0; this.t = 0; this.finished = false;
    this.x = 0; this.y = 0; this.scale = 1; this.flipX = false;
    this.alpha = 1; this.visible = true; this.angle = 0;
    this.extraOff = { x: 0, y: 0 };
  }
  add(name, prefix, fps = 24, loop = false, offsets = [0, 0], indices = null) {
    let frames = this.atlas ? this.atlas.byPrefix(prefix) : [];
    if (indices && indices.length) frames = indices.map(i => frames[i]).filter(Boolean);
    this.anims[name] = { name, frames, fps: fps || 24, loop: !!loop, offsets: offsets || [0, 0] };
    return this.anims[name].frames.length > 0;
  }
  has(n) { return !!this.anims[n] && this.anims[n].frames.length > 0; }
  play(name, force = false) {
    const a = this.anims[name];
    // A missing animation must not blank the sprite. Nulling `cur` here made
    // any character short one animation vanish every time it was asked for.
    if (!a || !a.frames.length) return false;
    if (!force && this.cur === a && !this.finished) return true;
    this.cur = a; this.idx = 0; this.t = 0; this.finished = false;
    return true;
  }
  get curName() { return this.cur ? this.cur.name : null; }
  update(dt) {
    const a = this.cur;
    if (!a || a.frames.length < 2) { if (a) this.finished = true; return; }
    this.t += dt;
    const step = 1 / a.fps;
    while (this.t >= step) {
      this.t -= step;
      this.idx++;
      if (this.idx >= a.frames.length) {
        if (a.loop) this.idx = 0;
        else { this.idx = a.frames.length - 1; this.finished = true; break; }
      }
    }
  }
  frame() { return this.cur ? this.cur.frames[this.idx] : null; }
  width()  { const f = this.frame(); return f ? f.fw * this.scale : 0; }
  height() { const f = this.frame(); return f ? f.fh * this.scale : 0; }
  draw(ctx) {
    if (!this.visible || !this.atlas) return false;
    const f = this.frame();
    if (!f) return false;
    const s = this.scale;
    const ox = (this.cur.offsets[0] + this.extraOff.x) * s;
    const oy = (this.cur.offsets[1] + this.extraOff.y) * s;
    const dx = this.x - f.fx * s - ox;
    const dy = this.y - f.fy * s - oy;
    ctx.save();
    ctx.globalAlpha *= this.alpha;
    if (this.flipX) { ctx.translate(dx * 2 + f.fw * s, 0); ctx.scale(-1, 1); }
    ctx.drawImage(this.atlas.img, f.x, f.y, f.w, f.h, dx, dy, f.w * s, f.h * s);
    ctx.restore();
    return true;
  }
}

/* ============================================================ CHARACTER == */
const SING = ['singLEFT', 'singDOWN', 'singUP', 'singRIGHT'];

/* Works out a character's animations from the sheet itself, for when there is
   no character json. Sheets name things loosely ("Bingo Left Note", "bingo
   sing left", "BINGO NOTE LEFT0"), so match on keywords rather than a fixed
   list. Anything it can't place is skipped, not guessed at. */
function autoAnims(atlas) {
  const pres = [];
  const seen = new Set();
  for (const fr of atlas.frames) {
    const m = /^(.*?)[ _-]?\d+$/.exec(fr.name);
    const p = m ? m[1] : fr.name;
    if (!seen.has(p)) { seen.add(p); pres.push(p); }
  }
  // shorter prefixes are the plainer ones: "Bingo Idle" before "Bingo Idle Alt"
  pres.sort((a, b) => a.length - b.length || a.localeCompare(b));

  const dirOf = t => /\bleft\b/.test(t) ? 0 : /\bdown\b/.test(t) ? 1
                  : /\bup\b/.test(t) ? 2 : /\bright\b/.test(t) ? 3 : -1;
  const out = [], taken = new Set();
  for (const p of pres) {
    const t = ' ' + p.toLowerCase().replace(/[_-]/g, ' ') + ' ';
    const d = dirOf(t), miss = /\bmiss\b/.test(t), dance = /\bdanc/.test(t);
    let anim = null;
    if (d >= 0 && !dance)        anim = SING[d] + (miss ? 'miss' : '');
    else if (dance && d === 0)   anim = 'danceLeft';
    else if (dance && d === 3)   anim = 'danceRight';
    else if (dance || /\bidle\b/.test(t)) anim = 'idle';
    if (!anim || taken.has(anim)) continue;
    taken.add(anim);
    out.push({ anim, name: p, fps: 24, loop: false, offsets: [0, 0] });
  }
  // Nothing matched — the sheet probably isn't a character (a cutscene strip,
  // say). Use its longest animation as an idle so something renders.
  if (!out.length && pres.length) {
    let best = pres[0], n = 0;
    for (const p of pres) {
      const c = atlas.byPrefix(p).length;
      if (c > n) { n = c; best = p; }
    }
    out.push({ anim: 'idle', name: best, fps: 24, loop: true, offsets: [0, 0] });
    console.warn('[h-slice] no sing/idle animations on this sheet — using "' +
                 best + '" as idle. This is probably the wrong sheet.');
  }
  return out;
}

class Character {
  constructor(name, isPlayer) {
    this.name = name; this.isPlayer = !!isPlayer;
    this.sprite = null; this.data = null;
    this.holdTimer = 0; this.danceIdle = false; this.danceDir = 0;
    this.singing = false; this.loadError = null;
    this.x = 0; this.y = 0; this.dead = false;
    this.healthColor = '#888';
    this.camOffset = [0, 0];
  }
  /* Accepts three character JSON dialects without conversion:
       Psych    { image, flip_x, camera_position, animations:[{anim, name, fps, loop, indices}] }
       V-Slice  { assetPath, flipX, cameraOffsets, offsets, singTime, danceEvery,
                  healthIcon:{id}, animations:[{name, prefix, frameRate, looped, frameIndices}] }
       plain    { image, animations:[{name, prefix, fps, loop, indices}] }                     */
  static async load(name, isPlayer, modDir) {
    const c = new Character(name, isPlayer);
    // A mod song only uses characters its own mod defined, so another mod's
    // "bingo" never leaks in. Then a .json, then the engine's built-ins.
    const own = modDir ? HSLICE.charactersByDir.get(modDir) : null;
    const reg = modDir ? ((own && own.get(name)) || null) : (HSLICE.characters.get(name) || null);
    const found = reg ? null : await Assets.findJson(CONFIG.roots.chars, name + '.json');
    let data = reg || (found ? found.data : null) || CONFIG.builtinCharacters[name] || null;
    // { alias: 'bf' } borrows a built-in, e.g. a mod's "bf-car" with no sheet of its own
    if (data && data.alias && CONFIG.builtinCharacters[data.alias]) data = CONFIG.builtinCharacters[data.alias];
    const fb = CONFIG.charactersFallback[name] || {};
    c.data = data;
    const d = data || {};

    c.healthColor = d.healthColor || d.health_color || d.healthbar_colors || fb.healthColor || '#888';   // healthbar_colors: Psych
    if (Array.isArray(c.healthColor)) c.healthColor = rgbArr(c.healthColor);
    c.camOffset = d.camera_position || d.cameraOffset || d.cameraOffsets || fb.camOffset || [0, 0];
    c.healthIcon = (d.healthIcon && d.healthIcon.id) || d.healthicon || name;
    // V-Slice singTime / danceEvery are in steps / beats; legacy has no equivalent.
    c.posOffset  = d.position || d.offsets2 || [0, 0];   // Psych's per-character nudge
    c.singSteps  = d.singTime ?? d.sing_duration ?? 4;   // sing_duration: Psych
    c.danceEvery = d.danceEvery ?? 1;

    // a json path if there is one, otherwise the usual ways sheets get named
    const guesses = [d.image || d.imagePath || d.assetPath || fb.image,
                     'characters/' + name, 'characters/' + name + '_sheet',
                     'characters/' + name + '_assets', 'characters/' + name + 'Sheet',
                     name].filter(Boolean);
    let imgPath = null, atlas = null;
    for (const g of guesses) {
      atlas = await Assets.atlas(String(g).replace(/^(images\/)?/, ''), { quiet: true });
      if (atlas) { imgPath = g; break; }
      const key = norm(String(g).replace(/^(images\/)?/, ''));
      // prefer naming a sheet whose xml we hold (baked) — that's the intended one
      if (BAKED.xml.has(key) || BAKED.frames.has(key)) c.foundSheet = g;
      else if (!c.foundSheet && Assets.atlasWhy.get(key) === 'xml blocked by file://')
        c.foundSheet = g;
    }
    if (guesses.length) {
      imgPath = imgPath || guesses[0];
      if (atlas) {
        const sp = new AnimSprite(atlas);
        sp.scale = d.scale || fb.scale || 1;
        sp.flipX = !!(d.flip_x ?? d.flipX ?? fb.flipX);
        // V-Slice puts a whole-character offset at the root; Psych bakes it per-anim.
        const root = d.offsets || [0, 0];
        sp.extraOff.x = root[0] || 0;
        sp.extraOff.y = root[1] || 0;
        let animList = d.animations;
        if (!animList || !animList.length) {
          animList = autoAnims(atlas);
          c.autoMapped = animList.length;
          console.log('[h-slice] "' + name + '" has no json — read ' + animList.length +
                      ' animations off the sheet: ' +
                      animList.map(a => a.anim + ' <- "' + a.name + '"').join(', '));
        }
        for (const a of animList) {
          // Psych keys the anim by `anim` and the XML prefix by `name`; the others
          // key the anim by `name` and the prefix by `prefix`.
          const animName = a.anim ?? a.name;
          const prefix   = a.anim !== undefined ? a.name : (a.prefix ?? a.name);
          const fps      = a.fps ?? a.frameRate ?? 24;
          const loop     = a.loop ?? a.looped ?? false;
          const indices  = a.indices ?? a.frameIndices ?? null;
          sp.add(animName, prefix, fps, !!loop, a.offsets || [0, 0], indices);
        }
        c.sprite = sp;
      }
    }
    // dance style: gf-likes alternate left/right
    c.danceIdle = !!(c.sprite && c.sprite.has('danceLeft') && c.sprite.has('danceRight'));

    if (!imgPath) c.loadError = 'no sheet found for "' + name + '"';
    else if (!c.sprite) {
      const file = String(c.foundSheet || imgPath).split('/').pop();
      const which = c.foundSheet || imgPath;   // name and reason must be the same sheet
      c.loadError = file + ': ' + (Assets.atlasWhy.get(norm(String(which).replace(/^(images\/)?/, ''))) || 'not found');
    }
    else if (!Object.keys(c.sprite.anims).some(a => c.sprite.has(a)))
      c.loadError = 'no animations matched the xml';
    if (c.loadError) console.warn('[h-slice] character "' + name + '": ' + c.loadError);

    c.dance(true);   // give it a frame now, not on the first beat
    return c;
  }
  /* Only an in-progress sing blocks the idle. Gating on holdTimer instead
     meant the timer ran away on the first frame and the idle never started,
     which left the sprite with no current frame at all. */
  /* Real sheets are nothing like the 190x300 placeholder, so the camera has
     to aim at the sprite's actual middle or it frames an armpit. */
  mid() {
    const w = (this.sprite && this.sprite.width())  || 190;
    const h = (this.sprite && this.sprite.height()) || 300;
    return [this.x + w / 2, this.y + h / 2];
  }
  dance(force = false) {
    if (!this.sprite) return;
    if (this.singing && !force) return;
    if (this.danceIdle) {
      this.danceDir ^= 1;
      this.sprite.play(this.danceDir ? 'danceRight' : 'danceLeft', true);
    } else this.sprite.play('idle', true);
  }
  /* Mirror the character. Their left pose would then point right, so left and
     right swap too — the way FNF does it — and pressing left still reads as left. */
  setFlip(on) {
    this.flipped = !!on;
    if (this.sprite) this.sprite.flipX = this.flipped ? !this.defFlip : !!this.defFlip;
  }
  sing(dir, miss = false) {
    if (this.flipped && (dir === 0 || dir === 3)) dir = 3 - dir;
    this.lastDir = dir; this.holdTimer = 0; this.singing = true;
    if (!this.sprite) return;
    const base = SING[dir];
    const n = miss && this.sprite.has(base + 'miss') ? base + 'miss' : base;
    // no sing frames for this direction: keep bopping to the beat instead of
    // freezing on the idle until the hold timer runs out
    if (!this.sprite.play(n, true)) this.singing = false;
  }
  update(dt, stepCrochet) {
    this.holdTimer += dt;
    if (this.singing && this.holdTimer > (stepCrochet / 1000) * (this.singSteps || 4)) {
      this.singing = false;
      this.dance(true);
    }
    if (this.sprite) this.sprite.update(dt);
  }
  draw(ctx) {
    if (this.sprite) {
      this.sprite.x = this.x; this.sprite.y = this.y;
      if (this.sprite.draw(ctx)) return;
    }
    drawCharPlaceholder(ctx, this);
  }
}
function rgbArr(a) { return '#' + a.slice(0, 3).map(v => (v | 0).toString(16).padStart(2, '0')).join(''); }

/* ============================================================= CONDUCTOR = */
class Conductor {
  constructor() {
    this.bpm = 100; this.crochet = 600; this.stepCrochet = 150;
    this.songPosition = 0; this.changes = [];
    this.step = -1; this.beat = -1; this.section = -1;
    this.onBeat = null; this.onStep = null;
  }
  setBPM(b) { this.bpm = b; this.crochet = 60000 / b; this.stepCrochet = this.crochet / 4; }
  setChanges(list) { this.changes = list.slice().sort((a, b) => a.time - b.time); }
  sync() {
    let last = null;
    for (const c of this.changes) { if (c.time <= this.songPosition) last = c; else break; }
    if (last && last.bpm !== this.bpm) this.setBPM(last.bpm);
  }
  tick(pos) {
    this.songPosition = pos;
    this.sync();
    const st = Math.floor(pos / this.stepCrochet);
    if (st !== this.step) {
      const prev = this.step; this.step = st;
      if (st > prev && this.onStep) for (let s = Math.max(prev + 1, st - 4); s <= st; s++) this.onStep(s);
      const bt = Math.floor(st / 4);
      if (bt !== this.beat) { this.beat = bt; if (this.onBeat) this.onBeat(bt); }
    }
  }
}

/* ================================================================ AUDIO == */
class AudioEngine {
  constructor() {
    this.ctx = null;
    this.tracks = [];   // [{buf, kind:'inst'|'player'|'opponent'|'both', gain, src}]
    this.startAt = 0; this.pauseAt = 0; this.playing = false;
    this.virtual = false; this.vStart = 0; this.el = null; this.els = [];
    this.length = 0; this.volume = 1;
  }
  ensureCtx() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  }
  async tryNames(folder, names) {
    for (const n of names) {
      const f = await Assets.findBytes(this.roots || CONFIG.roots.audio, folder + '/' + n);
      if (!f) continue;
      try { return await this.ctx.decodeAudioData(f.data.slice(0)); } catch (e) { /* next */ }
    }
    return null;
  }
  addTrack(buf, kind) {
    const g = this.ctx.createGain();
    g.gain.value = this.volume;
    g.connect(this.ctx.destination);
    this.tracks.push({ buf, kind, gain: g, src: null });
  }
  async loadSong(folder, chart, variation, extraRoots) {
    this.ensureCtx();
    this.roots = (extraRoots || []).concat(CONFIG.roots.audio);
    this.tracks = [];
    const V = variation ? '-' + variation : '';
    const exts = n => [n + '.ogg', n + '.mp3', n + '.wav'];
    const inst = await this.tryNames(folder,
      [...exts('Inst' + V), ...exts('Inst'), ...exts('inst')]);
    if (inst) this.addTrack(inst, 'inst');

    // V-Slice keeps one vocal stem per character; legacy has a single Voices file.
    let split = false;
    const v = (chart && chart.vocals) || null;
    if (v) {
      for (const [kind, list] of [['player', v.player || []], ['opponent', v.opponent || []]]) {
        for (const nm of list) {
          if (!nm) continue;
          const b = await this.tryNames(folder,
            [...exts(`Voices-${nm}${V}`), ...exts(`Voices-${nm}`)]);
          if (b) { this.addTrack(b, kind); split = true; }
        }
      }
    }
    if (!split) {                       // Psych 1.0 splits vocals by side
      const pv = await this.tryNames(folder, [...exts('Voices-Player' + V), ...exts('Voices-Player')]);
      const ov = await this.tryNames(folder, [...exts('Voices-Opponent' + V), ...exts('Voices-Opponent')]);
      if (pv) { this.addTrack(pv, 'player'); split = true; }
      if (ov) { this.addTrack(ov, 'opponent'); split = true; }
    }
    if (!split) {
      const b = await this.tryNames(folder,
        [...exts('Voices' + V), ...exts('Voices'), ...exts('voices')]);
      if (b) this.addTrack(b, 'both');
    }

    // Web Audio needs fetch, which file:// blocks. Fall back to <audio>, which
    // it allows. Sync is looser (no sample-accurate scheduling) but playable.
    if (!inst) {
      // Element fallback. It has to carry the vocal stems too — instrumental
      // only is half the song. Separate elements aren't sample-locked, but
      // they start together and stay close enough to play.
      const findUrl = async names => {
        for (const root of (this.roots || CONFIG.roots.audio))
          for (const n of names) {
            const u = root + folder + '/' + n;
            if (await probeAudioUrl(u)) return u;
          }
        return null;
      };
      const mkEl = (url, kind) => {
        const a = new Audio(url);
        a.volume = this.volume;
        this.els.push({ el: a, kind });
        return a;
      };
      this.els = [];
      const iu = await findUrl([...exts('Inst' + V), ...exts('Inst'), ...exts('inst')]);
      if (iu) {
        this.el = mkEl(iu, 'inst');
        await new Promise(r => {
          if (this.el.duration) return r();
          this.el.addEventListener('loadedmetadata', () => r(), { once: true });
          setTimeout(r, 3000);
        });
        this.length = (this.el.duration || 0) * 1000;

        let any = false;
        const v = (chart && chart.vocals) || null;
        if (v) {
          for (const [kind, list] of [['player', v.player || []], ['opponent', v.opponent || []]]) {
            for (const nm of list) {
              if (!nm) continue;
              const u = await findUrl([...exts(`Voices-${nm}${V}`), ...exts(`Voices-${nm}`)]);
              if (u) { mkEl(u, kind); any = true; }
            }
          }
        }
        if (!any) {                     // Psych 1.0 splits vocals by side
          const pu = await findUrl([...exts('Voices-Player' + V), ...exts('Voices-Player')]);
          const ou = await findUrl([...exts('Voices-Opponent' + V), ...exts('Voices-Opponent')]);
          if (pu) { mkEl(pu, 'player'); any = true; }
          if (ou) { mkEl(ou, 'opponent'); any = true; }
        }
        if (!any) {
          const u = await findUrl([...exts('Voices' + V), ...exts('Voices'), ...exts('voices')]);
          if (u) mkEl(u, 'both');
        }
      }
    } else { this.el = null; this.els = []; }

    this.virtual = !inst && !this.el;
    if (inst) this.length = inst.duration * 1000;
    const vw = (chart && chart.vocals) || {};
    this.vocalsWanted = [].concat(vw.player || [], vw.opponent || []).map(n => 'Voices-' + n + V).join(', ') || 'Voices';
    this.audioFound = this.el
      ? this.els.map(t => decodeURIComponent(String(t.el.src).split('/').pop())).join(', ')
      : (this.tracks.length ? this.tracks.map(t => t.kind).join(', ') : 'nothing');
    console.log('[h-slice] audio found: ' + this.audioFound + '  |  vocals looked for: ' + this.vocalsWanted);
    return !this.virtual;
  }
  /* FNF mutes the player's stem on a miss until the next clean hit */
  setVocalGain(kind, v) {
    for (const t of (this.els || [])) {          // element fallback
      if (t.kind === 'inst') continue;
      if (t.kind === kind || t.kind === 'both') t.el.volume = v * this.volume;
    }
    for (const t of this.tracks) {
      if (t.kind === 'inst') continue;
      if (t.kind === kind || t.kind === 'both') t.gain.gain.value = v * this.volume;
    }
  }
  play(fromMs = 0) {
    this.stopSources();
    if (this.el) {
      const at = Math.max(0, fromMs / 1000);
      for (const t of this.els) { t.el.currentTime = at; t.el.play().catch(() => {}); }
      this.playing = true; return;
    }
    if (this.virtual) {
      this.vStart = performance.now() - fromMs; this.playing = true; return;
    }
    const c = this.ensureCtx();
    const when = c.currentTime + 0.08;
    const off = Math.max(0, fromMs / 1000);
    for (const t of this.tracks) {
      if (off >= t.buf.duration) continue;
      const s = c.createBufferSource();
      s.buffer = t.buf;
      s.connect(t.gain);
      s.start(when, off);
      t.src = s;
    }
    this.startAt = when - off;
    this.playing = true;
  }
  stopSources() {
    for (const t of (this.els || [])) { try { t.el.pause(); } catch (e) {} }
    for (const t of this.tracks) {
      if (t.src) { try { t.src.stop(); } catch (e) {} t.src = null; }
    }
  }
  pause() {
    if (!this.playing) return;
    this.pauseAt = this.position;
    this.stopSources();
    this.playing = false;
  }
  resume() { this.play(this.pauseAt); }
  stop() { this.stopSources(); this.playing = false; this.pauseAt = 0; }
  get position() {
    if (!this.playing) return this.pauseAt;
    if (this.el) return (this.el.currentTime || 0) * 1000;
    if (this.virtual) return performance.now() - this.vStart;
    return (this.ctx.currentTime - this.startAt) * 1000;
  }
  get ended() {
    if (this.el) return this.el.ended || (this.length > 0 && this.position >= this.length);
    if (this.virtual) return this.position > (this.length || 60000);
    return this.length > 0 && this.position >= this.length;
  }
  async sfx(name, vol = 1) {
    const c = this.ensureCtx();
    const key = 'sfx:' + name;
    if (!Assets.buffers.has(key)) {
      let buf = null;
      for (const ext of ['.ogg', '.mp3', '.wav']) {
        const ab = await Assets.bytes(CONFIG.paths.sounds + name + ext);
        if (ab) { try { buf = await c.decodeAudioData(ab.slice(0)); break; } catch (e) {} }
      }
      Assets.buffers.set(key, buf);
    }
    const buf = Assets.buffers.get(key);
    if (!buf) return false;
    const s = c.createBufferSource(); s.buffer = buf;
    const g = c.createGain(); g.gain.value = vol;
    s.connect(g).connect(c.destination); s.start();
    return true;
  }
}

/* =========================================================== MENU MUSIC == */
/* Reads engineassets/songs/<name>.<ext>. Loops, and survives moving between
   menu screens — it only stops when gameplay starts. Browsers refuse audio
   before a user gesture, so playback begins on the first key or click. */
const AUDIO_EXT = ['.ogg', '.mp3', '.wav', '.m4a', '.flac', '.opus', '.aac'];

/* Dropped folders keep whatever case the OS gave them, so match loosely. */
function vfsKeyCI(key) {
  if (VFS.has(key)) return key;
  const want = key.toLowerCase();
  for (const k of VFS.keys()) if (k.toLowerCase() === want) return k;
  return null;
}
function vfsFindCI(key) { const k = vfsKeyCI(key); return k ? VFS.file(k) : null; }

async function engineBytes(rel, exts = AUDIO_EXT) {
  for (const e of exts) {
    const f = vfsFindCI('engine/' + rel + e);
    if (f) { try { return await f.arrayBuffer(); } catch (_) {} }
    try {
      const r = await fetch(CONFIG.paths.engine + rel + e);
      if (r.ok) return await r.arrayBuffer();
    } catch (_) { /* not there; try the next extension */ }
  }
  return null;
}

/* Menu sounds and the title logo, both from engineassets/ and both on plain
   media elements so they work from file:// exactly like the menu music. */
function probeAudioUrl(url) {
  return new Promise(res => {
    const a = new Audio();
    let done = false;
    const fin = v => { if (done) return; done = true; clearTimeout(t); res(v); };
    a.addEventListener('loadeddata', () => fin(true));
    a.addEventListener('canplay', () => fin(true));
    a.addEventListener('error', () => fin(false));
    const t = setTimeout(() => fin(false), 5000);
    a.src = url;
    try { a.load(); } catch (e) { fin(false); }
  });
}

const SFX = {
  urls: new Map(), missing: new Set(),

  async url(kind) {
    const name = (CONFIG.engine.sfx || {})[kind] || kind;
    if (this.urls.has(name)) return this.urls.get(name);
    if (this.missing.has(name)) return null;
    for (const e of AUDIO_EXT) {
      const k = vfsKeyCI('engine/sounds/' + name + e);
      const url = k ? VFS.url(k) : CONFIG.paths.engine + 'sounds/' + name + e;
      if (url && await probeAudioUrl(url)) { this.urls.set(name, url); return url; }
    }
    this.missing.add(name);
    return null;
  },

  play(kind) {
    this.url(kind).then(u => {
      if (!u) return;
      // a fresh element per hit so fast scrolling overlaps instead of cutting
      const a = new Audio(u);
      a.volume = CONFIG.engine.sfxVolume ?? 0.7;
      a.play().catch(() => {});
    }).catch(() => {});
  },
};

function loadImageUrl(url) {
  return new Promise(res => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => res(null);
    i.src = url;
  });
}

async function engineImage(names, exts = ['.png', '.webp', '.gif', '.jpg']) {
  for (const n of [].concat(names)) {
    for (const e of exts) {
      const k = vfsKeyCI('engine/images/' + n + e);
      const url = k ? VFS.url(k) : CONFIG.paths.engine + 'images/' + n + e;
      const img = url && await loadImageUrl(url);
      if (img) return img;
    }
  }
  return null;
}

function isFileProto() {
  return typeof location !== 'undefined' && location.protocol === 'file:';
}

/* Menu music runs on an <audio> element, NOT fetch + decodeAudioData.
   That is deliberate: fetch is blocked on the file:// origin, but media
   elements are not, so double-clicking index.html still gets you music.
   Gameplay audio keeps using Web Audio, where sample-accurate chart sync
   actually matters and a server is needed anyway for the chart JSON. */
const Music = {
  el: null, ready: false, playing: false, loading: false, failed: false,
  name: null, folder: null, blocked: false, t0: performance.now(),

  ensureEl() {
    if (!this.el) {
      const a = new Audio();
      a.loop = true; a.preload = 'auto';
      a.volume = CONFIG.engine.menuVolume ?? 0.6;
      this.el = a;
    }
    return this.el;
  },

  // Point the element at a url and see whether it can actually play it.
  probe(url) {
    return new Promise(res => {
      const a = this.ensureEl();
      let done = false;
      const finish = v => {
        if (done) return;
        done = true;
        a.removeEventListener('loadeddata', ok);
        a.removeEventListener('canplay', ok);
        a.removeEventListener('error', bad);
        clearTimeout(timer);
        res(v);
      };
      const ok = () => finish(true), bad = () => finish(false);
      a.addEventListener('loadeddata', ok);
      a.addEventListener('canplay', ok);
      a.addEventListener('error', bad);
      const timer = setTimeout(bad, 5000);
      a.src = url;
      try { a.load(); } catch (e) { bad(); }
    });
  },

  // Any audio file dropped into engineassets/songs/, under any name.
  async listFolder() {
    const rx = new RegExp('\\.(ogg|mp3|wav|m4a|flac|opus|aac)$', 'i');
    const inVfs = VFS.keys()
      .filter(k => /^engine\/songs\/[^/]+$/i.test(k) && rx.test(k) && !/\/game[-_]?over/i.test(k))
      .map(k => k.split('/').pop());
    if (inVfs.length || isFileProto()) return inVfs;   // no directory index on file://
    try {
      const r = await fetch(CONFIG.paths.engine + 'songs/');
      if (!r.ok) return [];
      const html = await r.text();
      return [...html.matchAll(new RegExp('href="([^"?]+\\.(?:ogg|mp3|wav|m4a|flac|opus|aac))"', 'gi'))]
        .map(m => decodeURIComponent(m[1].split('/').pop())).filter(n => !/^game[-_]?over/i.test(n));
    } catch (e) { return []; }
  },

  async load() {
    if (this.ready || this.loading || this.failed) return this.ready;
    this.loading = true;
    const dir = CONFIG.paths.engine + 'songs/';
    const tries = [];

    // 1. dropped folder — object urls, work on any origin
    for (const k of VFS.keys()) {
      if (!/^engine\/songs\/[^/]+\.(ogg|mp3|wav|m4a|flac|opus|aac)$/i.test(k)) continue;
      if (/^engine\/songs\/game[-_]?over/i.test(k)) continue;   // that's the game over song
      const u = VFS.url(k);
      if (u) tries.push([u, k.split('/').pop()]);
    }
    // 2. whatever is sitting in the folder (needs a directory index, so http only)
    this.folder = await this.listFolder();
    for (const n of this.folder) tries.push([dir + encodeURIComponent(n), n]);
    // 3. configured names — the only route that works from file://
    for (const n of [].concat(CONFIG.engine.menuMusic || []))
      for (const e of AUDIO_EXT) tries.push([dir + n + e, n + e]);

    for (const [url, label] of tries) {
      if (await this.probe(url)) { this.ready = true; this.name = label; break; }
    }
    this.loading = false;
    if (!this.ready) this.failed = true;
    return this.ready;
  },

  async play() {
    if (this.playing || this.loading || this.failed) return;
    if (!this.ready) { await this.load(); if (!this.ready) return; }
    try { await this.el.play(); this.playing = true; this.blocked = false; }
    catch (e) { this.blocked = true; }   // no gesture yet; the loop retries
  },

  stop() {
    if (this.el) { try { this.el.pause(); } catch (e) {} }
    this.playing = false;
  },

  get position() {
    if (this.playing && this.el) return (this.el.currentTime || 0) * 1000;
    return performance.now() - this.t0;
  },
  get beat()  { return this.position / (60000 / (CONFIG.engine.menuBPM || 102)); },
  get pulse() { return 1 - (this.beat % 1); },

  get status() {
    if (this.playing) return this.name || 'playing';
    if (this.loading) return 'loading\u2026';
    if (this.blocked) return 'waiting for a click';
    if (this.failed) {
      if (isFileProto())
        return 'nothing at ' + CONFIG.paths.engine + 'songs/' +
               ([].concat(CONFIG.engine.menuMusic || [])[0] || 'freakyMenu') + '.ogg';
      return (this.folder && this.folder.length)
        ? 'nothing playable in engineassets/songs/'
        : 'engineassets/songs/ is empty or not reachable';
    }
    return 'idle';
  },
};

/* ============================================================== MODS ===== */
/* A mod is a .js file, not a .json one. Script tags load from file://; fetch
   does not. That one difference is why a native mod runs from a double-click
   and a .fnfc never can. engineassets/mods.js lists which mods to pull in. */
const HSLICE = {
  songs: new Map(), stages: new Map(), stagesByDir: new Map(), _pending: [], _stageFiles: new Set(),
  characters: new Map(), charactersByDir: new Map(), weeks: [],

  /* A week, from engineassets/weeks.js:
       HSLICE.week('week1', 'Week 1', ['tutorial', 'bopeebo', 'fresh']);
     Each song is an ordinary mod folder inside engineassets/weeks/<id>/. */
  week(id, name, songs) {
    const def = (id && typeof id === 'object') ? id : { id, name, songs };
    if (!def || !def.id) return console.warn('[h-slice] HSLICE.week needs an id and a song list');
    const w = { id: String(def.id), name: def.name || String(def.id),
                songs: [].concat(def.songs || []).map(String),
                dir: CONFIG.paths.engine + 'weeks/' + def.id + '/' };
    const i = this.weeks.findIndex(x => x.id === w.id);
    if (i >= 0) this.weeks[i] = w; else this.weeks.push(w);
    for (const sid of w.songs) this.load(w.dir + sid + '/mod.js');
    return w;
  },

  load(src, opts) {                 // called by engineassets/mods.js
    const quiet = !!(opts && opts.quiet);   // the engine's own optional files
    const p = new Promise(res => {
      const t = document.createElement('script');
      t.src = src;
      t.onload = () => res(true);
      t.onerror = () => { if (!quiet) console.warn('[h-slice] mod not found:', src); res(false); };
      document.head.appendChild(t);
    });
    this._pending.push(p);
    return p;
  },

  /* A stage, from a mod's .js. The folder the calling script lives in becomes
     the first place its images are looked for. */
  stage(name, def) {
    if (!name || !def) return console.warn('[h-slice] HSLICE.stage needs a name and a definition');
    const cs = typeof document !== 'undefined' && document.currentScript;
    const from = cs && cs.getAttribute && cs.getAttribute('src');
    const entry = Object.assign({ dir: from ? from.replace(/[^/]*$/, '') : '' }, def);
    this.stages.set(String(name), entry);
    if (entry.dir) this.stagesByDir.set(entry.dir, entry);   // a mod folder's own stage
    return true;
  },

  /* A character, from a mod's .js. This is the only way a character definition
     loads on file://, because a .json needs fetch. It's remembered per mod
     folder, so two mods can each have their own "bingo". */
  character(name, def) {
    if (!name || !def) return console.warn('[h-slice] HSLICE.character needs a name and a definition');
    const cs = typeof document !== 'undefined' && document.currentScript;
    const from = cs && cs.getAttribute && cs.getAttribute('src');
    const dir = from ? from.replace(/[^/]*$/, '') : '';
    this.characters.set(String(name), def);
    if (dir) {
      if (!this.charactersByDir.has(dir)) this.charactersByDir.set(dir, new Map());
      this.charactersByDir.get(dir).set(String(name), def);
    }
    return true;
  },

  /* Spritesheet frames, already parsed by the mod builder. Nothing gets parsed
     in the browser, so a BOM or a malformed .xml can't break it. An .xml on
     disk, when there is one, still wins. */
  sheet(name, groups) { BAKED.sheet(name, groups); return true; },

  song(def) {                       // called by each mod's own .js
    if (!def || !def.id) return console.warn('[h-slice] mod song needs an id');
    const diffs = def.difficulties || Object.keys(def.charts || { normal: 1 });
    // variations are either a list of names, or { erect: { metadata, charts } }
    const vdata = (def.variations && !Array.isArray(def.variations)) ? def.variations : null;
    def.variationData = vdata;
    const vnames = vdata ? Object.keys(vdata) : (def.variations || []);
    this.songs.set(def.id, def);
    // Where this mod.js was loaded from — so a mod plays from mods/ or from
    // engineassets/weeks/week1/ alike.
    const cs = typeof document !== 'undefined' && document.currentScript;
    const from = cs && cs.getAttribute && cs.getAttribute('src');
    const modDir = from ? from.replace(/[^/]*$/, '') : ('mods/' + (def.folder || def.id) + '/');
    const holder = modDir.replace(/[^/]+\/$/, '');        // the folder the mod folder sits in
    const folderName = modDir.replace(/\/$/, '').split('/').pop();
    const wk = this.weeks.find(w => modDir.startsWith(w.dir));
    // a stage can come inline with the song, or by name from HSLICE.stage()
    let stageName = '';

/* ========================================================= CHART LOADER == */
const ChartLoader = {
  detect(json) {
    if (!json) return 'none';
    if (json.song && (json.song.notes || json.song.sectionNotes)) return 'legacy';
    if (json.notes && json.scrollSpeed && json.version) return 'vslice';
    if (json.notes && !Array.isArray(json.notes)) return 'vslice';
    return 'legacy';
  },

  legacy(json) {
    // Psych 1.0 dropped the { song: {...} } wrapper, so `song` can be the title
    const s = (json.song && typeof json.song === 'object') ? json.song : json;
    // psych_v1 format: notes 0-3 are always the player, whatever mustHitSection says
    const v1 = /^psych_v1/.test(String(s.format || json.format || ''));
    const bpm = s.bpm || 100;
    const speed = s.speed || 1;
    const notes = [], sections = [], changes = [{ time: 0, bpm }];
    let t = 0, cur = bpm;

    for (let i = 0; i < (s.notes || []).length; i++) {
      const sec = s.notes[i] || {};
      if (sec.changeBPM && sec.bpm) { cur = sec.bpm; changes.push({ time: t, bpm: cur }); }
      const steps = sec.lengthInSteps || (sec.sectionBeats ? sec.sectionBeats * 4 : 16);   // Psych 0.6+ uses sectionBeats
      const stepC = (60000 / cur) / 4;
      const mustHit = sec.mustHitSection !== false;
      sections.push({ start: t, end: t + steps * stepC, mustHit });

      for (const n of (sec.sectionNotes || [])) {
        const time = n[0], data = n[1] | 0, len = n[2] || 0;
        if (data < 0) continue;                       // event note
        const isPlayer = v1 ? data < 4 : ((data < 4) === mustHit);
        notes.push(mkNote(time, data % 4, len, isPlayer ? 1 : 0, typeof n[3] === 'string' ? n[3] : ''));
      }
      t += steps * stepC;
    }
    notes.sort((a, b) => a.time - b.time);
    return {
      title: (typeof s.song === 'string' && s.song) || 'Unknown', bpm, speed, notes, sections, changes,
      player: s.player1 || 'bf', opponent: s.player2 || 'dad',
      gf: s.gfVersion || s.player3 || 'gf', stage: s.stage || 'stage',
      needsVoices: s.needsVoices !== false,
    };
  },

  /* --- V-Slice (Funkin' 0.3+ / .fnfc) -------------------------------------
     Split across <song>-chart.json and <song>-metadata.json.
       chart:    { version, scrollSpeed:{diff:n}, events:[], notes:{diff:[]} }
       note:     { t: ms, d: 0-7, l?: ms, k?: kind }   l and k omitted when empty
       d 0-3 = PLAYER, 4-7 = OPPONENT  (inverted vs legacy, no mustHitSection)
       metadata: playData.characters, timeChanges, offsets
       event durations are in STEPS, not ms.                                  */
  vslice(chart, meta) {
    meta = meta || {};
    const pd = meta.playData || {};
    const noteSets = chart.notes || {};
    const diffs = (pd.difficulties || Object.keys(noteSets)).filter(d => noteSets[d]);
    if (!diffs.length) throw new Error('V-Slice chart has no note data');

    const wanted = chart.__difficulty;
    const diff = (wanted && noteSets[wanted]) ? wanted
               : (noteSets.normal ? 'normal' : diffs[0]);

    // time changes -> bpm map
    const tcs = (meta.timeChanges && meta.timeChanges.length)
      ? meta.timeChanges : [{ t: 0, bpm: 100, n: 4, d: 4 }];
    const changes = tcs.map(c => ({
      time: c.t || 0, bpm: c.bpm || 100,
      num: c.n || 4, den: c.d || 4,
    })).sort((a, b) => a.time - b.time);

    const ss = chart.scrollSpeed || {};
    const speed = ss[diff] ?? ss.default ?? 1;
    const offset = (meta.offsets && meta.offsets.instrumental) || 0;

    const notes = (noteSets[diff] || []).map(n => {
      const d = n.d | 0;
      return mkNote((n.t || 0) + offset, d % 4, n.l || 0, d < 4 ? 1 : 0, n.k || '');
    }).sort((a, b) => a.time - b.time);

    const events = (chart.events || []).map(e => ({
      time: (e.t || 0) + offset, type: e.e, v: e.v || {},
    })).sort((a, b) => a.time - b.time);

    const ch = pd.characters || {};
    return {
      format: 'vslice',
      title: meta.songName || 'Unknown',
      artist: meta.artist || '', charter: meta.charter || '',
      bpm: changes[0].bpm, speed, notes, events, changes,
      sections: null,                       // events drive the camera, not sections
      player: ch.player || 'bf',
      opponent: ch.opponent || 'dad',
      gf: ch.girlfriend || 'gf',
      stage: pd.stage || 'stage',
      noteStyle: pd.noteStyle || 'funkin',
      difficulty: diff, difficulties: diffs,
      variations: pd.songVariations || [],
      // no vocal list in the metadata means the characters' own names,
      // as in V-Slice: player "bf" -> Voices-bf.ogg
      vocals: {
        player:   [].concat(ch.playerVocals   || [ch.player   || 'bf']),
        opponent: [].concat(ch.opponentVocals || [ch.opponent || 'dad']),
      },
      needsVoices: true, offset,
    };
  },

  parse(chartJson, metaJson, difficulty) {
    const kind = this.detect(chartJson);
    if (kind === 'vslice') {
      if (difficulty) chartJson.__difficulty = difficulty;
      return this.vslice(chartJson, metaJson);
    }
    return this.legacy(chartJson);
  },

  // Fallback so the engine has something to play before any files exist.
  generateTest(bpm = 150, bars = 24) {
    const crochet = 60000 / bpm, step = crochet / 4;
    const notes = [], sections = [], changes = [{ time: 0, bpm }];
    const patterns = [
      [0, 4, 8, 12], [0, 2, 4, 6, 8, 10, 12, 14], [0, 3, 6, 9, 12],
      [0, 4, 6, 8, 12, 14], [0, 1, 2, 3, 8, 9, 10, 11],
    ];
    for (let b = 0; b < bars; b++) {
      const start = b * 16 * step;
      const mustHit = b % 2 === 1;
      sections.push({ start, end: start + 16 * step, mustHit });
      if (b < 2) continue;                              // let the intro breathe
      const pat = patterns[b % patterns.length];
      for (let k = 0; k < pat.length; k++) {
        const dir = (b * 3 + k * 2 + (k % 2 ? 1 : 0)) % 4;
        const hold = (b > 7 && k === pat.length - 1) ? step * 4 : 0;
        notes.push(mkNote(start + pat[k] * step, dir, hold, mustHit ? 1 : 0, ''));
      }
    }
    notes.sort((a, b) => a.time - b.time);
    return {
      title: 'Test', bpm, speed: 2.1, notes, sections, changes,
      player: 'bf', opponent: 'dad', gf: 'gf', stage: 'stage',
      needsVoices: false, generated: true,
      length: bars * 16 * step + 4000,
    };
  },
};
function mkNote(time, dir, len, player, type) {
  return {
    time, dir, len: len || 0, player, type: type || '',
    hit: false, missed: false, held: false, dropped: false,
    holdEnd: time + (len || 0), lastHoldScore: time,

/* =============================================================== EASING == */
/* Flixel's ease set, which is what V-Slice event `ease` names refer to.
   "CLASSIC" and "INSTANT" are FocusCamera-only modes, handled at the call site. */
function bounceOut(t) {
  const n = 7.5625, d = 2.75;
  if (t < 1 / d) return n * t * t;
  if (t < 2 / d) return n * (t -= 1.5 / d) * t + 0.75;
  if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + 0.9375;
  return n * (t -= 2.625 / d) * t + 0.984375;
}
const EASE_IN = {
  linear:  t => t,
  sine:    t => 1 - Math.cos((t * Math.PI) / 2),
  quad:    t => t * t,
  cube:    t => t * t * t,
  cubic:   t => t * t * t,
  quart:   t => t * t * t * t,
  quint:   t => t ** 5,
  expo:    t => (t === 0 ? 0 : Math.pow(2, 10 * t - 10)),
  circ:    t => 1 - Math.sqrt(Math.max(0, 1 - t * t)),
  back:    t => 2.70158 * t * t * t - 1.70158 * t * t,
  elastic: t => (t === 0 ? 0 : t === 1 ? 1
             : -Math.pow(2, 10 * t - 10) * Math.sin((t * 10 - 10.75) * ((2 * Math.PI) / 3))),
  bounce:  t => 1 - bounceOut(1 - t),
};
function easeFn(name, dir) {
  const base = EASE_IN[name];
  if (name === 'smoothStep')   return t => t * t * (3 - 2 * t);
  if (name === 'smootherStep') return t => t * t * t * (t * (t * 6 - 15) + 10);
  if (!base || name === 'linear') return EASE_IN.linear;
  if (dir === 'Out')   return t => 1 - base(1 - t);
  if (dir === 'InOut') return t => (t < 0.5 ? base(2 * t) / 2 : 1 - base(2 - 2 * t) / 2);
  return base;
}

/* =============================================================== CAMERA == */
class Camera {
  constructor() {
    this.x = W / 2; this.y = H / 2; this.tx = W / 2; this.ty = H / 2;
    this.zoom = 1; this.baseZoom = 1; this.bop = 0;
    this.lerp = 3.2;
    this.posTween = null; this.zoomTween = null;
  }
  follow(x, y) { this.tx = x; this.ty = y; }
  snap() { this.x = this.tx; this.y = this.ty; this.zoom = this.baseZoom; this.posTween = this.zoomTween = null; }
  /* event-driven move; durMs 0 snaps */
  tweenTo(x, y, durMs, ease) {
    this.tx = x; this.ty = y;
    if (!durMs || durMs <= 0) { this.x = x; this.y = y; this.posTween = null; return; }
    this.posTween = { fx: this.x, fy: this.y, tx: x, ty: y, t: 0, dur: durMs / 1000, ease: ease || EASE_IN.linear };
  }
  tweenZoom(to, durMs, ease) {
    if (!durMs || durMs <= 0) { this.baseZoom = to; this.zoom = to + this.bop; this.zoomTween = null; return; }
    this.zoomTween = { from: this.baseZoom, to, t: 0, dur: durMs / 1000, ease: ease || EASE_IN.linear };
    this.baseZoom = to;
  }
  update(dt) {
    if (this.posTween) {
      const w = this.posTween; w.t += dt;
      const k = Math.min(1, w.t / w.dur), e = w.ease(k);
      this.x = w.fx + (w.tx - w.fx) * e;
      this.y = w.fy + (w.ty - w.fy) * e;
      if (k >= 1) this.posTween = null;
    } else {
      const k = 1 - Math.exp(-this.lerp * dt);
      this.x += (this.tx - this.x) * k;
      this.y += (this.ty - this.y) * k;
    }
    let base = this.baseZoom;
    if (this.zoomTween) {
      const w = this.zoomTween; w.t += dt;
      const k = Math.min(1, w.t / w.dur), e = w.ease(k);
      base = w.from + (w.to - w.from) * e;
      if (k >= 1) this.zoomTween = null;
    }
    this.bop *= Math.exp(-9 * dt);
    this.zoom = base + this.bop;
  }
  apply(ctx) {
    ctx.translate(W / 2, H / 2);
    ctx.scale(this.zoom, this.zoom);
    ctx.translate(-this.x, -this.y);
  }
}

/* ================================================================ INPUT == */
const Input = {
  down: new Set(), pressed: new Set(), clicked: false,
  lanes: [false, false, false, false],
  mouse: { x: 0, y: 0, down: false, justDown: false, justUp: false, wheel: 0 },
  /* canvas is letterboxed by css, so map client px back to the 1280x720 space */
  trackMouse(cv) {
    const to = e => {
      const r = cv.getBoundingClientRect();
      this.mouse.x = (e.clientX - r.left) * (W / r.width);
      this.mouse.y = (e.clientY - r.top) * (H / r.height);
    };
    cv.addEventListener('pointerdown', e => { to(e); this.mouse.down = true; this.mouse.justDown = true; });
    cv.addEventListener('pointermove', to);
    cv.addEventListener('wheel', e => { this.mouse.wheel += e.deltaY; e.preventDefault(); }, { passive: false });
    addEventListener('pointerup', e => { to(e); this.mouse.down = false; this.mouse.justUp = true; });
  },
  init() {
    addEventListener('keydown', e => {
      if (e.repeat) { e.preventDefault(); return; }
      this.down.add(e.code); this.pressed.add(e.code);
      const lane = this.laneOf(e.code);
      if (lane >= 0) { this.lanes[lane] = true; Game.laneDown(lane); e.preventDefault(); }
      else Game.key(e);
      if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter','Tab'].includes(e.code)) e.preventDefault();
    });
    addEventListener('keyup', e => {
      this.down.delete(e.code);
      const lane = this.laneOf(e.code);
      if (lane >= 0 && !OPT.binds[lane].some(c => this.down.has(c))) {
        this.lanes[lane] = false; Game.laneUp(lane);
      }
    });
    addEventListener('pointerdown', () => { this.clicked = true; });
    this.trackMouse(ctx.canvas);
    addEventListener('blur', () => { this.down.clear(); this.lanes = [false, false, false, false]; });
  },
  laneOf(code) {
    for (let i = 0; i < 4; i++) if (OPT.binds[i].includes(code)) return i;
    return -1;
  },
  just(code) { return this.pressed.has(code); },
  anyKey() { return this.pressed.size > 0; },
  endFrame() { this.pressed.clear(); this.clicked = false;
    this.mouse.justDown = false; this.mouse.justUp = false; this.mouse.wheel = 0; },
};

const ctx = document.getElementById('game').getContext('2d', { alpha: false });
ctx.imageSmoothingQuality = 'high';

function fitCanvas() {
  const cv = ctx.canvas;
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', fitCanvas); fitCanvas();

function text(s, x, y, size = 28, color = '#fff', align = 'left', weight = 'bold', outline = 4) {
  ctx.save();
  ctx.font = `${weight} ${size}px "Trebuchet MS", "Segoe UI", sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  if (outline) {
    ctx.lineWidth = outline; ctx.strokeStyle = 'rgba(0,0,0,.85)';
    ctx.lineJoin = 'round'; ctx.strokeText(s, x, y);
  }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
  ctx.restore();
}

function arrowPath(p, cx, cy, r, dir) {
  // dir 0 L, 1 D, 2 U, 3 R — rotate a simple chevron
  const rot = [Math.PI, Math.PI / 2, -Math.PI / 2, 0][dir];
  p.save(); p.translate(cx, cy); p.rotate(rot);
  p.beginPath();
  p.moveTo(r * 0.85, 0);
  p.lineTo(r * 0.05, -r * 0.8);
  p.lineTo(r * 0.05, -r * 0.3);
  p.lineTo(-r * 0.85, -r * 0.3);
  p.lineTo(-r * 0.85, r * 0.3);
  p.lineTo(r * 0.05, r * 0.3);
  p.lineTo(r * 0.05, r * 0.8);
  p.closePath();
  p.restore();
}

function drawArrowPlaceholder(x, y, size, dir, mode) {
  const c = CONFIG.noteskin.colors[dir];
  const cx = x + size / 2, cy = y + size / 2, r = size * 0.36;
  ctx.save();
  if (mode === 'static') {
    ctx.globalAlpha = 0.62;
    arrowPath(ctx, cx, cy, r, dir);
    ctx.lineWidth = Math.max(3, size * 0.06); ctx.strokeStyle = '#d9d2e4'; ctx.stroke();
  } else if (mode === 'confirm') {
    arrowPath(ctx, cx, cy, r * 1.14, dir);
    ctx.fillStyle = c; ctx.fill();
    ctx.lineWidth = Math.max(3, size * 0.07); ctx.strokeStyle = '#fff'; ctx.stroke();
  } else if (mode === 'press') {
    ctx.globalAlpha = 0.85;
    arrowPath(ctx, cx, cy, r * 0.9, dir);
    ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.fill();
    ctx.lineWidth = Math.max(3, size * 0.06); ctx.strokeStyle = '#fff'; ctx.stroke();
  } else { // note
    arrowPath(ctx, cx, cy, r, dir);
    ctx.fillStyle = c; ctx.fill();
    ctx.lineWidth = Math.max(3, size * 0.075); ctx.strokeStyle = 'rgba(0,0,0,.75)'; ctx.stroke();
  }
  ctx.restore();
}

function drawCharPlaceholder(ctx2, ch) {
  const bob = ch.holdTimer < 0.18 ? 8 : 0;
  const w = 190, h = 300;
  ctx2.save();
  ctx2.globalAlpha = 0.95;
  ctx2.fillStyle = ch.healthColor;
  roundRect(ctx2, ch.x, ch.y - bob, w, h, 16); ctx2.fill();
  ctx2.fillStyle = 'rgba(0,0,0,.35)';
  const d = ch.lastDir;
  if (ch.holdTimer < 0.2 && d !== undefined) {
    arrowPath(ctx2, ch.x + w / 2, ch.y - bob + h * 0.35, 46, d);
    ctx2.fill();
  } else {
    ctx2.beginPath(); ctx2.arc(ch.x + w * 0.34, ch.y - bob + h * 0.3, 15, 0, 7); ctx2.fill();
    ctx2.beginPath(); ctx2.arc(ch.x + w * 0.66, ch.y - bob + h * 0.3, 15, 0, 7); ctx2.fill();
  }
  ctx2.fillStyle = 'rgba(0,0,0,.55)';
  ctx2.font = 'bold 22px "Trebuchet MS", sans-serif'; ctx2.textAlign = 'center';
  ctx2.fillText(ch.name, ch.x + w / 2, ch.y - bob + h - 26);
  if (ch.loadError) {
    ctx2.fillStyle = 'rgba(0,0,0,.75)';
    ctx2.font = '13px "Trebuchet MS", sans-serif';
    ctx2.fillText(ch.loadError.slice(0, 40), ch.x + w / 2, ch.y - bob + h - 7);
  }
  ctx2.restore();
}

function roundRect(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

const NOTE_SIZE = 112;
const LANE_GAP  = 118;

class Strum {
  constructor(dir, isPlayer, atlas) {
    this.dir = dir; this.isPlayer = isPlayer;
    this.x = 0; this.y = 0;
    this.sprite = null; this.resetIn = 0;
    if (atlas) {
      const d = CONFIG.noteskin.dirs[dir];
      const sp = new AnimSprite(atlas);
      sp.scale = CONFIG.noteskin.scale;
      const a = sp.add('static', d.strum, 24, false);
      const b = sp.add('press', d.press, 24, false);
      const c = sp.add('confirm', d.confirm, 24, false);
      if (a && b && c) { this.sprite = sp; sp.play('static'); }
    }
  }
  play(n) {
    this.state = n;
    if (this.sprite) this.sprite.play(n, true);
    if (n === 'confirm' && !this.isPlayer) this.resetIn = 0.16;
  }
  update(dt) {
    if (this.sprite) this.sprite.update(dt);
    if (this.resetIn > 0) { this.resetIn -= dt; if (this.resetIn <= 0) this.play('static'); }
  }
  draw() {
    if (this.sprite) {
      // keep the sprite's visual box centred on our lane slot
      this.sprite.x = this.x + NOTE_SIZE / 2 - this.sprite.width() / 2;
      this.sprite.y = this.y + NOTE_SIZE / 2 - this.sprite.height() / 2;
      if (this.sprite.draw(ctx)) return;
    }
    drawArrowPlaceholder(this.x, this.y, NOTE_SIZE, this.dir, this.state || 'static');
  }
}

const Game = {

class TitleState {
  enter() {
    // Gate first: the click is what lets the browser start audio at all, so
    // the title (and its music) only appear once we actually have sound.
    this.t = 0; this.bg = null; this.gate = true; this.logo = null;
    Assets.image(CONFIG.paths.images + CONFIG.ui.title + '.png').then(i => { this.bg = i; });
    engineImage(CONFIG.engine.logo).then(i => { this.logo = i; });
  }
  update(dt) {
    this.t += dt;
    if (this.gate) {
      if (Input.clicked || Input.anyKey()) {
        Game.audio.ensureCtx();
        this.gate = false; this.t = 0;
      }
      return;
    }
    if (Input.just('Enter') || Input.just('Space')) { Game.audio.ensureCtx(); Game.set(new MenuState()); }
  }
  draw() {
    if (this.bg) ctx.drawImage(this.bg, 0, 0, W, H);
    else {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#1b0f2b'); g.addColorStop(1, '#070510');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    if (this.gate) {
      ctx.globalAlpha = 0.6 + Math.sin(this.t * 3) * 0.4;

      text('any key works too', W / 2, H / 2 + 46, 20, '#6f6383', 'center', 'normal', 0);
      return;
    }
    // title slides up over its first half second
    const intro = Math.min(1, this.t / 0.5);
    const rise = (1 - intro) * 40;
    ctx.globalAlpha = intro;
    const bob = Math.sin(this.t * 3) * 6;
    if (this.logo) {
      // bumps on the beat of the menu song, like the real title screen
      const bump = Music.playing ? 1 + Math.pow(Music.pulse, 3) * 0.05 : 1;
      const sc = Math.min(760 / this.logo.width, 300 / this.logo.height) * bump;
      const lw = this.logo.width * sc, lh = this.logo.height * sc;
      ctx.drawImage(this.logo, W / 2 - lw / 2, 275 + bob + rise - lh / 2, lw, lh);
      text('H-SLICE', W / 2, 462 + rise, 46, '#ff5ea8', 'center', 'bold', 7);
    } else {
      text("FRIDAY NIGHT FUNKIN'", W / 2, 260 + bob + rise, 62, '#fff', 'center', 'bold', 9);
      text('H-SLICE', W / 2, 348 + bob + rise, 104, '#ff5ea8', 'center', 'bold', 11);
    }
    ctx.globalAlpha = 0.55 + Math.sin(this.t * 5) * 0.45;
    text('press enter', W / 2, 560, 30, '#fff', 'center', 'bold', 5);
    ctx.globalAlpha = 1;
    if (!Music.playing)
      text('menu song: ' + Music.status, W / 2, 688, 16, '#8a6d84', 'center', 'normal', 0);
    text('build ' + BUILD, W - 16, H - 14, 14, '#4d4361', 'right', 'normal', 0);
  }
}

class MenuState {

    if (Input.just('ArrowDown') || Input.just('KeyS')) this.sel = (this.sel + 1) % this.items.length;
    if (Input.just('Enter') || Input.just('Space')) {
      const it = this.items[this.sel];
      if (it === 'story') Game.set(new WeeksState());
      else if (it === 'freeplay') Game.set(new FreeplayState());
      else if (it === 'options') Game.set(new OptionsState());
